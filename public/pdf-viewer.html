<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>PDF閲覧</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #525659;
    }
    .pdf-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #3b6fd4;
      color: white;
      min-height: 52px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .back-btn:active { background: rgba(255,255,255,0.4); }
    .pdf-title {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dl-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      white-space: nowrap;
      flex-shrink: 0;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .dl-btn:active { background: rgba(255,255,255,0.4); }
    .pdf-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
    }
    .pdf-page-wrap { margin-bottom: 10px; text-align: center; }
    .pdf-canvas-box { position: relative; display: block; line-height: 0; }
    canvas {
      display: block;
      width: 100%;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .pdf-link-overlay {
      position: absolute;
      cursor: pointer;
      background: rgba(59,111,212,0.06);
      border-bottom: 1px solid rgba(59,111,212,0.5);
      box-sizing: border-box;
      z-index: 2;
    }
    .textLayer {
      position: absolute;
      left: 0; top: 0;
      overflow: hidden;
      line-height: 1;
      z-index: 1;
    }
    .textLayer span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
      -webkit-user-select: text;
      user-select: text;
    }
    .textLayer span::selection { background: rgba(59,111,212,.35); }
    .pdf-status {
      color: white;
      text-align: center;
      padding: 48px 24px;
      font-size: 15px;
      line-height: 2;
    }
    .pdf-status .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .page-info { color: rgba(255,255,255,0.6); font-size: 12px; text-align: center; margin-bottom: 6px; }
    .pdf-footer {
      flex-shrink: 0;
      background: white;
      border-top: 1px solid #e2e8f0;
      padding: 12px 16px;
      text-align: center;
    }
    .check-btn {
      background: #16a34a;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
      max-width: 360px;
    }
    .check-btn:active { opacity: 0.8; }
    .check-btn.checked {
      background: #f0fdf4;
      color: #16a34a;
      border: 2px solid #16a34a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 auto;
    }
    .uncheck-link {
      font-size: 12px;
      color: #94a3b8;
      text-decoration: underline;
      cursor: pointer;
      white-space: nowrap;
    }
    .scroll-hint {
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      text-align: center;
      padding: 10px 16px;
      flex-shrink: 0;
      background: rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
<div class="pdf-header" id="pdfHeader">
  <button class="back-btn" onclick="goBack()">← 戻る</button>
  <div class="pdf-title" id="pdfTitle">PDF</div>
  <a class="dl-btn" id="dlBtn" href="#" style="display:none">⬇ 保存</a>
</div>
<div class="pdf-body" id="pdfBody">
  <div class="pdf-status">
    <div class="spinner"></div>
    <div>PDFを読み込んでいます…</div>
  </div>
</div>
<div class="scroll-hint" id="scrollHint" style="display:none">↓ 最後までスクロールすると確認ボタンが表示されます</div>
<div class="pdf-footer" id="pdfFooter" style="display:none">
  <button class="check-btn" id="checkBtn" onclick="toggleCheck()"></button>
</div>
<div id="urlSheet" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.5)" onclick="closeUrlSheet()">
  <div onclick="event.stopPropagation()" style="position:absolute;bottom:0;left:0;right:0;background:white;border-radius:16px 16px 0 0;padding:20px 16px">
    <p style="font-size:12px;color:#94a3b8;margin-bottom:6px">PDF内のURL</p>
    <textarea id="urlSheetInput" rows="3" style="width:100%;font-size:12px;padding:10px;border:1px solid #e2e8f0;border-radius:6px;background:#f8fafc;color:#334155;resize:none;font-family:monospace;margin-bottom:12px;box-sizing:border-box"></textarea>
    <button id="urlCopyBtn" onclick="copyUrlSheet()" style="width:100%;padding:14px;background:#3b6fd4;color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;margin-bottom:8px;cursor:pointer">📋 URLをコピー</button>
    <button id="urlShareBtn" onclick="shareUrl()" style="display:none;width:100%;padding:14px;background:#0ea5e9;color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;margin-bottom:8px;cursor:pointer">📤 共有する</button>
    <button onclick="openUrlSheet()" style="width:100%;padding:14px;background:#f1f5f9;color:#1e293b;border:none;border-radius:8px;font-size:15px;font-weight:600;margin-bottom:8px;cursor:pointer">🔗 開く</button>
    <button onclick="closeUrlSheet()" style="width:100%;padding:14px;background:white;color:#64748b;border:1px solid #e2e8f0;border-radius:8px;font-size:15px;cursor:pointer">キャンセル</button>
  </div>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const params = new URLSearchParams(location.search);
const file = params.get('file') || '';
const title = params.get('title') || 'PDF';
const backId = params.get('id') || '';
const embedded = params.get('embedded') === '1';
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth <= 768;

// URL action sheet
let urlSheetCurrent = '';
function showUrlSheet(url) {
  urlSheetCurrent = url;
  const ta = document.getElementById('urlSheetInput');
  ta.value = url;
  document.getElementById('urlCopyBtn').textContent = '📋 URLをコピー';
  document.getElementById('urlShareBtn').style.display = navigator.share ? '' : 'none';
  document.getElementById('urlSheet').style.display = '';
  setTimeout(() => { ta.focus(); ta.select(); ta.setSelectionRange(0, url.length); }, 80);
}
function closeUrlSheet() { document.getElementById('urlSheet').style.display = 'none'; }
function copyUrlSheet() {
  const btn = document.getElementById('urlCopyBtn');
  const ta = document.getElementById('urlSheetInput');
  // readonlyを一時解除してfocus/selectを確実に行う
  ta.removeAttribute('readonly');
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, urlSheetCurrent.length);
  // execCommandを先に試す（同期的 = ユーザージェスチャーを確実に保持）
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(_) {}
  ta.setAttribute('readonly', '');
  if (ok) {
    btn.textContent = '✓ コピーしました';
    setTimeout(() => { btn.textContent = '📋 URLをコピー'; }, 2000);
    return;
  }
  // Fallback: Clipboard API（async、iOSなど）
  if (navigator.clipboard) {
    navigator.clipboard.writeText(urlSheetCurrent)
      .then(() => { btn.textContent = '✓ コピーしました'; setTimeout(() => { btn.textContent = '📋 URLをコピー'; }, 2000); })
      .catch(() => { btn.textContent = '上のURLを長押し → コピー'; });
  } else {
    btn.textContent = '上のURLを長押し → コピー';
  }
}
async function shareUrl() {
  try { await navigator.share({ url: urlSheetCurrent }); } catch(_) {}
}
function openUrlSheet() { closeUrlSheet(); openRedirect(urlSheetCurrent); }

document.getElementById('pdfTitle').textContent = title;
document.title = title;

const fileUrl = '/uploads/' + file;
const dlBtn = document.getElementById('dlBtn');
dlBtn.href = '#';
dlBtn.addEventListener('click', async function(e){
  e.preventDefault();
  const orig = dlBtn.textContent;
  dlBtn.textContent = '⏳';
  try {
    const res = await fetch(fileUrl);
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = title + '.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
  } catch(_) {
    window.open(fileUrl, '_blank', 'noopener noreferrer');
  } finally {
    dlBtn.textContent = orig;
  }
});

if (embedded) {
  document.getElementById('pdfHeader').style.display = 'none';
}

let isChecked = false;
let scrollUnlocked = false;

function unlockFooter() {
  if (scrollUnlocked) return;
  scrollUnlocked = true;
  document.getElementById('scrollHint').style.display = 'none';
  document.getElementById('pdfFooter').style.display = '';
}

function checkScrollBottom() {
  if (scrollUnlocked) return;
  const body = document.getElementById('pdfBody');
  if (body.scrollTop + body.clientHeight >= body.scrollHeight - 80) {
    unlockFooter();
  }
}

async function initMeta() {
  const meRes = await fetch('/api/auth/me');
  if (meRes.ok) {
    const user = await meRes.json();
    if (user.role === 'admin') document.getElementById('dlBtn').style.display = embedded ? 'none' : '';
  }
  if (backId) {
    const checkRes = await fetch(`/api/progress/check/${backId}`);
    if (checkRes.ok) {
      const data = await checkRes.json();
      isChecked = data.checked;
      renderCheckBtn();
      if (isChecked) unlockFooter();
    }
  }
}

function renderCheckBtn() {
  const btn = document.getElementById('checkBtn');
  if (isChecked) {
    btn.className = 'check-btn checked';
    btn.innerHTML = '<span>✅ 確認済み</span><span class="uncheck-link" onclick="toggleCheck(event)">取り消す</span>';
  } else {
    btn.className = 'check-btn';
    btn.textContent = '✅ 確認しました';
  }
}

async function toggleCheck(e) {
  if (e) e.stopPropagation();
  const btn = document.getElementById('checkBtn');
  btn.disabled = true;
  if (isChecked) {
    const res = await fetch(`/api/progress/check/${backId}`, { method: 'DELETE' });
    if (res.ok) { isChecked = false; renderCheckBtn(); }
  } else {
    const res = await fetch(`/api/progress/check/${backId}`, { method: 'POST' });
    if (res.ok) { isChecked = true; renderCheckBtn(); }
  }
  btn.disabled = false;
}

async function openRedirect(url) {
  try {
    const res = await fetch('/api/url-redirects/resolve?url=' + encodeURIComponent(url));
    if (res.ok) {
      const data = await res.json();
      const backParam = encodeURIComponent(location.pathname + location.search);
      const dest = '/view.html?id=' + data.manual_id + '&back=' + backParam;
      if (embedded) {
        window.parent.location.href = dest;
      } else {
        location.href = dest;
      }
      return;
    }
  } catch (_) {}
  window.open(url, '_blank', 'noopener noreferrer');
}

async function loadPDF() {
  const body = document.getElementById('pdfBody');
  try {
    const pdf = await pdfjsLib.getDocument({
      url: fileUrl,
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
      cMapPacked: true,
      standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/'
    }).promise;
    body.innerHTML = '';
    const containerWidth = body.clientWidth || (window.innerWidth - 24);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const naturalVp = page.getViewport({ scale: 1 });
      const scale = (containerWidth / naturalVp.width) * dpr;
      const vp = page.getViewport({ scale });

      const wrap = document.createElement('div');
      wrap.className = 'pdf-page-wrap';
      if (pdf.numPages > 1) {
        const label = document.createElement('div');
        label.className = 'page-info';
        label.textContent = `${i} / ${pdf.numPages}`;
        wrap.appendChild(label);
      }

      const canvas = document.createElement('canvas');
      canvas.width = vp.width;
      canvas.height = vp.height;
      canvas.style.width = containerWidth + 'px';
      canvas.style.height = Math.round(containerWidth * naturalVp.height / naturalVp.width) + 'px';

      const canvasBox = document.createElement('div');
      canvasBox.className = 'pdf-canvas-box';
      canvasBox.appendChild(canvas);
      wrap.appendChild(canvasBox);
      body.appendChild(wrap);

      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;

      const displayVp = page.getViewport({ scale: containerWidth / naturalVp.width });
      const displayH = Math.round(containerWidth * naturalVp.height / naturalVp.width);

      // テキストレイヤー（文字選択・コピー用）
      try {
        const textContent = await page.getTextContent();
        const textDiv = document.createElement('div');
        textDiv.className = 'textLayer';
        textDiv.style.width = containerWidth + 'px';
        textDiv.style.height = displayH + 'px';
        canvasBox.appendChild(textDiv);
        pdfjsLib.renderTextLayer({ textContentSource: textContent, container: textDiv, viewport: displayVp });
      } catch(_) {}

      // リンクオーバーレイ
      const annotations = await page.getAnnotations();
      if (annotations.length > 0) {
        for (const ann of annotations) {
          if (ann.subtype !== 'Link') continue;
          const url = ann.url || (ann.action && ann.action.url);
          if (!url) continue;
          const r = displayVp.convertToViewportRectangle(ann.rect);
          const left = Math.min(r[0], r[2]);
          const top = Math.min(r[1], r[3]);
          const width = Math.abs(r[2] - r[0]);
          const height = Math.abs(r[3] - r[1]);
          const overlay = document.createElement('span');
          overlay.className = 'pdf-link-overlay';
          overlay.style.left = left + 'px';
          overlay.style.top = top + 'px';
          overlay.style.width = width + 'px';
          overlay.style.height = height + 'px';
          overlay.title = url;
          overlay.addEventListener('click', () => {
            if (isMobile) { showUrlSheet(url); } else { openRedirect(url); }
          });
          canvasBox.appendChild(overlay);
        }
      }
    }

    body.addEventListener('scroll', checkScrollBottom, { passive: true });
    setTimeout(() => {
      if (!scrollUnlocked) {
        if (body.scrollHeight <= body.clientHeight + 80) {
          unlockFooter();
        } else {
          document.getElementById('scrollHint').style.display = '';
        }
      }
    }, 300);
  } catch(e) {
    body.innerHTML = `
      <div class="pdf-status">
        <div>PDFの読み込みに失敗しました</div>
        <a href="${fileUrl}" style="color:#93c5fd; text-decoration:underline;">直接開く</a>
      </div>`;
    unlockFooter();
  }
}

function goBack() {
  if (backId) {
    location.href = '/view.html?id=' + backId;
  } else {
    history.length > 1 ? history.back() : window.close();
  }
}

initMeta();
loadPDF();
</script>
</body>
</html>
