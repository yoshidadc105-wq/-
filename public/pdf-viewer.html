<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>PDF閲覧</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #525659;
    }
    .pdf-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #3b6fd4;
      color: white;
      min-height: 52px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .back-btn:active { background: rgba(255,255,255,0.4); }
    .pdf-title {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dl-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      white-space: nowrap;
      flex-shrink: 0;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .dl-btn:active { background: rgba(255,255,255,0.4); }
    .pdf-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
    }
    .pdf-page-wrap { margin-bottom: 10px; text-align: center; }
    .pdf-canvas-box { position: relative; display: block; line-height: 0; }
    canvas {
      display: block;
      width: 100%;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .pdf-link-overlay {
      position: absolute;
      cursor: pointer;
      background: rgba(59,111,212,0.06);
      border-bottom: 1px solid rgba(59,111,212,0.5);
      box-sizing: border-box;
    }
    .pdf-status {
      color: white;
      text-align: center;
      padding: 48px 24px;
      font-size: 15px;
      line-height: 2;
    }
    .pdf-status .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .page-info { color: rgba(255,255,255,0.6); font-size: 12px; text-align: center; margin-bottom: 6px; }
    .pdf-footer {
      flex-shrink: 0;
      background: white;
      border-top: 1px solid #e2e8f0;
      padding: 12px 16px;
      text-align: center;
    }
    .check-btn {
      background: #16a34a;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
      max-width: 360px;
    }
    .check-btn:active { opacity: 0.8; }
    .check-btn.checked {
      background: #f0fdf4;
      color: #16a34a;
      border: 2px solid #16a34a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 auto;
    }
    .uncheck-link {
      font-size: 12px;
      color: #94a3b8;
      text-decoration: underline;
      cursor: pointer;
      white-space: nowrap;
    }
    .scroll-hint {
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      text-align: center;
      padding: 10px 16px;
      flex-shrink: 0;
      background: rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
<div class="pdf-header" id="pdfHeader">
  <button class="back-btn" onclick="goBack()">← 戻る</button>
  <div class="pdf-title" id="pdfTitle">PDF</div>
  <a class="dl-btn" id="dlBtn" href="#" style="display:none">⬇ 保存</a>
</div>
<div class="pdf-body" id="pdfBody">
  <div class="pdf-status">
    <div class="spinner"></div>
    <div>PDFを読み込んでいます…</div>
  </div>
</div>
<div class="scroll-hint" id="scrollHint" style="display:none">↓ 最後までスクロールすると確認ボタンが表示されます</div>
<div class="pdf-footer" id="pdfFooter" style="display:none">
  <button class="check-btn" id="checkBtn" onclick="toggleCheck()"></button>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const params = new URLSearchParams(location.search);
const file = params.get('file') || '';
const title = params.get('title') || 'PDF';
const backId = params.get('id') || '';
const embedded = params.get('embedded') === '1';

document.getElementById('pdfTitle').textContent = title;
document.title = title;

const fileUrl = '/uploads/' + file;
document.getElementById('dlBtn').href = fileUrl;

if (embedded) {
  document.getElementById('pdfHeader').style.display = 'none';
}

let isChecked = false;
let scrollUnlocked = false;

function unlockFooter() {
  if (scrollUnlocked) return;
  scrollUnlocked = true;
  document.getElementById('scrollHint').style.display = 'none';
  document.getElementById('pdfFooter').style.display = '';
}

function checkScrollBottom() {
  if (scrollUnlocked) return;
  const body = document.getElementById('pdfBody');
  if (body.scrollTop + body.clientHeight >= body.scrollHeight - 80) {
    unlockFooter();
  }
}

async function initMeta() {
  const meRes = await fetch('/api/auth/me');
  if (meRes.ok) {
    const user = await meRes.json();
    if (user.role === 'admin') document.getElementById('dlBtn').style.display = embedded ? 'none' : '';
  }
  if (backId) {
    const checkRes = await fetch(`/api/progress/check/${backId}`);
    if (checkRes.ok) {
      const data = await checkRes.json();
      isChecked = data.checked;
      renderCheckBtn();
      if (isChecked) unlockFooter();
    }
  }
}

function renderCheckBtn() {
  const btn = document.getElementById('checkBtn');
  if (isChecked) {
    btn.className = 'check-btn checked';
    btn.innerHTML = '<span>✅ 確認済み</span><span class="uncheck-link" onclick="toggleCheck(event)">取り消す</span>';
  } else {
    btn.className = 'check-btn';
    btn.textContent = '✅ 確認しました';
  }
}

async function toggleCheck(e) {
  if (e) e.stopPropagation();
  const btn = document.getElementById('checkBtn');
  btn.disabled = true;
  if (isChecked) {
    const res = await fetch(`/api/progress/check/${backId}`, { method: 'DELETE' });
    if (res.ok) { isChecked = false; renderCheckBtn(); }
  } else {
    const res = await fetch(`/api/progress/check/${backId}`, { method: 'POST' });
    if (res.ok) { isChecked = true; renderCheckBtn(); }
  }
  btn.disabled = false;
}

async function openRedirect(url) {
  try {
    const res = await fetch('/api/url-redirects/resolve?url=' + encodeURIComponent(url));
    if (res.ok) {
      const data = await res.json();
      if (embedded) {
        window.parent.location.href = '/view.html?id=' + data.manual_id;
      } else {
        location.href = '/view.html?id=' + data.manual_id;
      }
      return;
    }
  } catch (_) {}
  window.open(url, '_blank', 'noopener noreferrer');
}

async function loadPDF() {
  const body = document.getElementById('pdfBody');
  try {
    const pdf = await pdfjsLib.getDocument(fileUrl).promise;
    body.innerHTML = '';
    const containerWidth = body.clientWidth || (window.innerWidth - 24);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const naturalVp = page.getViewport({ scale: 1 });
      const scale = (containerWidth / naturalVp.width) * dpr;
      const vp = page.getViewport({ scale });

      const wrap = document.createElement('div');
      wrap.className = 'pdf-page-wrap';
      if (pdf.numPages > 1) {
        const label = document.createElement('div');
        label.className = 'page-info';
        label.textContent = `${i} / ${pdf.numPages}`;
        wrap.appendChild(label);
      }

      const canvas = document.createElement('canvas');
      canvas.width = vp.width;
      canvas.height = vp.height;
      canvas.style.width = containerWidth + 'px';
      canvas.style.height = Math.round(containerWidth * naturalVp.height / naturalVp.width) + 'px';

      const canvasBox = document.createElement('div');
      canvasBox.className = 'pdf-canvas-box';
      canvasBox.appendChild(canvas);
      wrap.appendChild(canvasBox);
      body.appendChild(wrap);

      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;

      const annotations = await page.getAnnotations();
      if (annotations.length > 0) {
        const displayVp = page.getViewport({ scale: containerWidth / naturalVp.width });
        for (const ann of annotations) {
          if (ann.subtype !== 'Link') continue;
          const url = ann.url || (ann.action && ann.action.url);
          if (!url) continue;
          const r = displayVp.convertToViewportRectangle(ann.rect);
          const left = Math.min(r[0], r[2]);
          const top = Math.min(r[1], r[3]);
          const width = Math.abs(r[2] - r[0]);
          const height = Math.abs(r[3] - r[1]);
          const overlay = document.createElement('span');
          overlay.className = 'pdf-link-overlay';
          overlay.style.left = left + 'px';
          overlay.style.top = top + 'px';
          overlay.style.width = width + 'px';
          overlay.style.height = height + 'px';
          overlay.title = url;
          overlay.addEventListener('click', () => openRedirect(url));
          canvasBox.appendChild(overlay);
        }
      }
    }

    body.addEventListener('scroll', checkScrollBottom, { passive: true });
    setTimeout(() => {
      if (!scrollUnlocked) {
        if (body.scrollHeight <= body.clientHeight + 80) {
          unlockFooter();
        } else {
          document.getElementById('scrollHint').style.display = '';
        }
      }
    }, 300);
  } catch(e) {
    body.innerHTML = `
      <div class="pdf-status">
        <div>PDFの読み込みに失敗しました</div>
        <a href="${fileUrl}" style="color:#93c5fd; text-decoration:underline;">直接開く</a>
      </div>`;
    unlockFooter();
  }
}

function goBack() {
  if (backId) {
    location.href = '/view.html?id=' + backId;
  } else {
    history.length > 1 ? history.back() : window.close();
  }
}

initMeta();
loadPDF();
</script>
</body>
</html>
