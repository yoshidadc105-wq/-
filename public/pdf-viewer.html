<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>PDF閲覧</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #525659;
    }
    .pdf-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #3b6fd4;
      color: white;
      min-height: 52px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      z-index: 10;
    }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .back-btn:active { background: rgba(255,255,255,0.4); }
    .pdf-title {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dl-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      white-space: nowrap;
      flex-shrink: 0;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .dl-btn:active { background: rgba(255,255,255,0.4); }
    .pdf-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
    }
    .pdf-page-wrap {
      margin-bottom: 10px;
      text-align: center;
    }
    canvas {
      display: block;
      width: 100%;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .pdf-status {
      color: white;
      text-align: center;
      padding: 48px 24px;
      font-size: 15px;
      line-height: 2;
    }
    .pdf-status .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .page-info {
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      text-align: center;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
<div class="pdf-header">
  <button class="back-btn" onclick="goBack()">← 戻る</button>
  <div class="pdf-title" id="pdfTitle">PDF</div>
  <a class="dl-btn" id="dlBtn" href="#">⬇ 保存</a>
</div>
<div class="pdf-body" id="pdfBody">
  <div class="pdf-status">
    <div class="spinner"></div>
    <div>PDFを読み込んでいます…</div>
  </div>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const params = new URLSearchParams(location.search);
const file = params.get('file') || '';
const title = params.get('title') || 'PDF';
const backId = params.get('id') || '';

document.getElementById('pdfTitle').textContent = title;
document.title = title;

const fileUrl = '/uploads/' + file;
document.getElementById('dlBtn').href = fileUrl;

async function loadPDF() {
  const body = document.getElementById('pdfBody');
  try {
    const pdf = await pdfjsLib.getDocument(fileUrl).promise;
    body.innerHTML = '';

    const containerWidth = body.clientWidth || (window.innerWidth - 24);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const naturalVp = page.getViewport({ scale: 1 });
      const scale = (containerWidth / naturalVp.width) * dpr;
      const vp = page.getViewport({ scale });

      const wrap = document.createElement('div');
      wrap.className = 'pdf-page-wrap';

      if (pdf.numPages > 1) {
        const label = document.createElement('div');
        label.className = 'page-info';
        label.textContent = `${i} / ${pdf.numPages}`;
        wrap.appendChild(label);
      }

      const canvas = document.createElement('canvas');
      canvas.width = vp.width;
      canvas.height = vp.height;
      canvas.style.width = containerWidth + 'px';
      canvas.style.height = Math.round(containerWidth * naturalVp.height / naturalVp.width) + 'px';
      wrap.appendChild(canvas);
      body.appendChild(wrap);

      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    }
  } catch (e) {
    body.innerHTML = `
      <div class="pdf-status">
        <div>PDFの読み込みに失敗しました</div>
        <a href="${fileUrl}" style="color:#93c5fd; text-decoration:underline;">直接開く</a>
      </div>`;
  }
}

function goBack() {
  if (backId) {
    location.href = '/view.html?id=' + backId;
  } else {
    history.length > 1 ? history.back() : window.close();
  }
}

loadPDF();
</script>
</body>
</html>
