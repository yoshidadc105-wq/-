<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クイズ管理 | のびのび歯科</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic Pro","Meiryo",sans-serif;background:#f1f5f9;color:#1e293b;font-size:14px}
header{background:#4f46e5;color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:17px;font-weight:bold}
header span{font-size:13px;opacity:.8}
.container{max-width:1100px;margin:0 auto;padding:20px 16px}
.tabs{display:flex;gap:4px;margin-bottom:20px;background:#fff;border-radius:10px;padding:6px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab-btn{flex:1;padding:10px;border:none;background:none;border-radius:7px;cursor:pointer;font-size:13px;font-weight:bold;color:#64748b;transition:all .2s}
.tab-btn.active{background:#4f46e5;color:#fff}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ログイン */
#login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh}
.login-card{background:#fff;border-radius:14px;padding:40px 36px;box-shadow:0 2px 12px rgba(0,0,0,.1);width:100%;max-width:360px;text-align:center}
.login-card h2{font-size:20px;color:#4f46e5;margin-bottom:8px}
.login-card p{color:#64748b;font-size:13px;margin-bottom:24px}
.login-card input{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px 14px;font-size:15px;margin-bottom:14px;outline:none}
.login-card input:focus{border-color:#4f46e5}
.btn-primary{background:#4f46e5;color:#fff;border:none;border-radius:8px;padding:11px 24px;font-size:14px;font-weight:bold;cursor:pointer;width:100%;transition:background .2s}
.btn-primary:hover{background:#4338ca}
.btn-danger{background:#ef4444;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
.btn-danger:hover{background:#dc2626}
.btn-edit{background:#f59e0b;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
.btn-edit:hover{background:#d97706}
.btn-sm{background:#4f46e5;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
.error-msg{color:#ef4444;font-size:13px;margin-top:8px}

/* テーブル */
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:20px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:15px;font-weight:bold;color:#1e293b}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;padding:9px 12px;text-align:left;font-size:12px;color:#64748b;border-bottom:1px solid #e2e8f0}
td{padding:10px 12px;border-bottom:1px solid #f1f5f9;font-size:13px;vertical-align:top}
tr:hover td{background:#fafafa}
.type-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:bold}
.type-fill{background:#dbeafe;color:#1d4ed8}
.type-sort{background:#fce7f3;color:#9d174d}
.type-choice{background:#d1fae5;color:#065f46}
.type-truefalse{background:#fef3c7;color:#92400e}
.type-manual{background:#ede9fe;color:#5b21b6}
.correct{color:#16a34a;font-weight:bold}
.wrong{color:#dc2626;font-weight:bold}
.pending{color:#64748b}

/* フォーム */
.form-section{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:24px}
.form-group{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:bold;color:#475569;margin-bottom:5px}
.required::after{content:"必須";font-size:10px;background:#ef4444;color:#fff;border-radius:3px;padding:1px 4px;margin-left:6px}
input[type="text"],input[type="password"],textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none;transition:border .2s}
input[type="text"]:focus,textarea:focus,select:focus{border-color:#4f46e5}
textarea{resize:vertical;min-height:80px}
.type-selector{display:flex;gap:8px;flex-wrap:wrap}
.type-option{border:2px solid #cbd5e1;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;color:#64748b;transition:all .2s;user-select:none}
.type-option.selected{border-color:#4f46e5;background:#ede9fe;color:#4f46e5;font-weight:bold}
.option-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.option-row input{flex:1}
.btn-add-option{background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px;color:#475569}
.btn-add-option:hover{background:#e2e8f0}
.btn-remove{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.btn-remove:hover{color:#ef4444}
.answer-select{margin-top:8px}
.fill-answers{margin-top:10px}
.fill-answer-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fill-answer-row label{margin:0;white-space:nowrap;color:#4f46e5;font-weight:bold;font-size:13px}
.truefalse-btns{display:flex;gap:12px;margin-top:6px}
.tf-btn{flex:1;padding:14px;border:2px solid #cbd5e1;border-radius:10px;font-size:22px;cursor:pointer;background:#fff;transition:all .2s}
.tf-btn.selected-true{border-color:#16a34a;background:#dcfce7}
.tf-btn.selected-false{border-color:#dc2626;background:#fee2e2}
.hint{font-size:11px;color:#94a3b8;margin-top:4px}
.sort-items{margin-top:8px}

/* モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.modal-overlay.hidden{display:none}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:28px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:16px;font-weight:bold;color:#1e293b}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#94a3b8;line-height:1}
.modal-close:hover{color:#1e293b}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.btn-secondary{background:#f1f5f9;color:#475569;border:none;border-radius:8px;padding:9px 20px;font-size:14px;cursor:pointer}
.btn-secondary:hover{background:#e2e8f0}

/* 採点 */
.grade-manual{display:flex;gap:8px;align-items:center}
.btn-correct{background:#16a34a;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.btn-wrong{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.filter-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-row select,.filter-row input{width:auto;flex:1;min-width:120px}
.empty{text-align:center;padding:40px;color:#94a3b8;font-size:14px}

@media(max-width:600px){
  .modal{padding:20px}
  .type-selector{gap:6px}
  .type-option{padding:7px 10px;font-size:12px}
}
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login-wrap">
  <div class="login-card">
    <h2>🔐 クイズ管理</h2>
    <p>管理者パスワードを入力してください</p>
    <input type="password" id="pw-input" placeholder="パスワード" />
    <button class="btn-primary" onclick="doLogin()">ログイン</button>
    <p class="error-msg" id="login-err" style="display:none">パスワードが違います</p>
  </div>
</div>

<!-- メインアプリ -->
<div id="app" style="display:none">
  <header>
    <h1>📝 クイズ管理画面</h1>
    <span id="header-info"></span>
  </header>
  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('tab-list')">問題一覧</button>
      <button class="tab-btn" onclick="showTab('tab-create')">＋ 新規作成</button>
      <button class="tab-btn" onclick="showTab('tab-subs')">回答記録</button>
    </div>

    <!-- 問題一覧 -->
    <div id="tab-list" class="tab-panel active">
      <div class="card">
        <div class="card-header">
          <span class="card-title" id="quiz-count">読み込み中...</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>種類</th>
              <th>タイトル</th>
              <th>問題文</th>
              <th>作成日</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="quiz-tbody">
            <tr><td colspan="5" class="empty">読み込み中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 新規作成 -->
    <div id="tab-create" class="tab-panel">
      <div class="form-section" id="create-form-wrap">
        <h2 style="font-size:16px;margin-bottom:20px;color:#4f46e5">新しい問題を作成</h2>
        <div id="create-form-inner"></div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">
          <button class="btn-secondary" onclick="resetCreateForm()">リセット</button>
          <button class="btn-primary" onclick="submitCreate()">保存する</button>
        </div>
      </div>
    </div>

    <!-- 回答記録 -->
    <div id="tab-subs" class="tab-panel">
      <div class="card">
        <div class="card-header">
          <span class="card-title">スタッフ回答記録</span>
        </div>
        <div class="filter-row">
          <input type="text" id="filter-staff" placeholder="スタッフ名で絞り込み" oninput="renderSubs()" />
          <select id="filter-type" onchange="renderSubs()">
            <option value="">全種類</option>
            <option value="fill">穴埋め</option>
            <option value="sort">並び替え</option>
            <option value="choice">選択式</option>
            <option value="truefalse">マルバツ</option>
            <option value="manual">マニュアル</option>
          </select>
          <select id="filter-result" onchange="renderSubs()">
            <option value="">全結果</option>
            <option value="correct">正解</option>
            <option value="wrong">不正解</option>
            <option value="pending">未採点</option>
          </select>
        </div>
        <table>
          <thead>
            <tr>
              <th>日時</th>
              <th>スタッフ</th>
              <th>問題</th>
              <th>種類</th>
              <th>回答</th>
              <th>結果</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="subs-tbody">
            <tr><td colspan="7" class="empty">読み込み中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 編集モーダル -->
<div class="modal-overlay hidden" id="edit-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">問題を編集</span>
      <button class="modal-close" onclick="closeEditModal()">×</button>
    </div>
    <div id="edit-form-inner"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeEditModal()">キャンセル</button>
      <button class="btn-primary" onclick="submitEdit()">保存する</button>
    </div>
  </div>
</div>

<script>
let authHeader = '';
let allQuizzes = [];
let allSubs = [];
let editingId = null;

// ===== 認証 =====

function doLogin() {
  const pw = document.getElementById('pw-input').value;
  if (!pw) return;
  const encoded = btoa(':' + pw);
  authHeader = 'Basic ' + encoded;
  fetch('/api/quizzes/admin', { headers: { Authorization: authHeader } })
    .then(r => {
      if (!r.ok) throw new Error();
      return r.json();
    })
    .then(data => {
      allQuizzes = data;
      document.getElementById('login-wrap').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('header-info').textContent = 'ログイン済み';
      initCreateForm();
      renderQuizList();
      loadSubs();
    })
    .catch(() => {
      document.getElementById('login-err').style.display = 'block';
    });
}

document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// ===== タブ =====

function showTab(id) {
  document.querySelectorAll('.tab-panel').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const idx = ['tab-list','tab-create','tab-subs'].indexOf(id);
  document.querySelectorAll('.tab-btn')[idx].classList.add('active');
  if (id === 'tab-list') loadQuizzes();
  if (id === 'tab-subs') loadSubs();
}

// ===== 問題一覧 =====

function typeName(t) {
  return {fill:'穴埋め',sort:'並び替え',choice:'選択式',truefalse:'マルバツ',manual:'マニュアル'}[t] || t;
}
function typeBadge(t) {
  return `<span class="type-badge type-${t}">${typeName(t)}</span>`;
}

function loadQuizzes() {
  fetch('/api/quizzes/admin', { headers: { Authorization: authHeader } })
    .then(r => r.json()).then(data => { allQuizzes = data; renderQuizList(); });
}

function renderQuizList() {
  const tbody = document.getElementById('quiz-tbody');
  document.getElementById('quiz-count').textContent = `問題一覧（${allQuizzes.length}件）`;
  if (!allQuizzes.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">問題がまだありません</td></tr>';
    return;
  }
  tbody.innerHTML = allQuizzes.map(q => {
    const dt = new Date(q.createdAt).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const qText = q.question.length > 40 ? q.question.slice(0,40)+'…' : q.question;
    return `<tr>
      <td>${typeBadge(q.type)}</td>
      <td><strong>${esc(q.title)}</strong></td>
      <td style="color:#64748b">${esc(qText)}</td>
      <td style="color:#94a3b8;white-space:nowrap">${dt}</td>
      <td style="white-space:nowrap">
        <button class="btn-edit" onclick="openEditModal('${q.id}')">編集</button>
        &nbsp;
        <button class="btn-danger" onclick="deleteQuiz('${q.id}','${esc(q.title)}')">削除</button>
      </td>
    </tr>`;
  }).join('');
}

function deleteQuiz(id, title) {
  if (!confirm(`「${title}」を削除しますか？`)) return;
  fetch(`/api/quizzes/${id}`, { method:'DELETE', headers:{ Authorization: authHeader } })
    .then(r => r.json()).then(() => loadQuizzes());
}

// ===== フォームビルダー =====

function buildForm(quiz) {
  const type = quiz ? quiz.type : null;
  return `
    <div class="form-group">
      <label class="required">問題の種類</label>
      <div class="type-selector" id="type-selector">
        ${['fill','sort','choice','truefalse','manual'].map(t =>
          `<div class="type-option${type===t?' selected':''}" data-type="${t}" onclick="selectType('${t}',this.closest('.type-selector'))">${typeName(t)}</div>`
        ).join('')}
      </div>
      <input type="hidden" id="f-type" value="${type||''}" />
    </div>
    <div class="form-group">
      <label class="required">タイトル</label>
      <input type="text" id="f-title" placeholder="例: 消毒手順チェック" value="${esc(quiz?.title||'')}" />
    </div>
    <div class="form-group">
      <label class="required">問題文</label>
      <textarea id="f-question" placeholder="問題文を入力してください（穴埋めは空白部分を___ と書いてください）" oninput="onQuestionInput()">${esc(quiz?.question||'')}</textarea>
    </div>
    <div id="f-type-extra"></div>
    <div class="form-group">
      <label>解説（正解後に表示）</label>
      <textarea id="f-explanation" placeholder="解説を入力（任意）">${esc(quiz?.explanation||'')}</textarea>
    </div>
  `;
}

function selectType(type, container) {
  container.querySelectorAll('.type-option').forEach(el => el.classList.remove('selected'));
  container.querySelector(`[data-type="${type}"]`).classList.add('selected');
  document.getElementById('f-type').value = type;
  renderTypeExtra(type);
}

function renderTypeExtra(type, quiz) {
  const el = document.getElementById('f-type-extra');
  if (type === 'fill') {
    el.innerHTML = `
      <div class="form-group">
        <label class="required">答え（___の数だけ入力）</label>
        <p class="hint">問題文の___ と対応する順番で入力してください</p>
        <div id="fill-answers" class="fill-answers"></div>
        <button class="btn-add-option" onclick="addFillAnswer()">＋ 答えを追加</button>
      </div>`;
    const answers = Array.isArray(quiz?.answer) ? quiz.answer : (quiz?.answer ? [quiz.answer] : ['']);
    document.getElementById('fill-answers').innerHTML = '';
    answers.forEach((a, i) => addFillAnswer(i+1, a));
  } else if (type === 'sort') {
    el.innerHTML = `
      <div class="form-group">
        <label class="required">正しい順番で項目を入力</label>
        <p class="hint">スタッフには順番がシャッフルされて表示されます</p>
        <div id="sort-items" class="sort-items"></div>
        <button class="btn-add-option" onclick="addSortItem()">＋ 項目を追加</button>
      </div>`;
    const items = Array.isArray(quiz?.options) && quiz.options.length ? quiz.options : ['',''];
    document.getElementById('sort-items').innerHTML = '';
    items.forEach(v => addSortItem(v));
  } else if (type === 'choice') {
    el.innerHTML = `
      <div class="form-group">
        <label class="required">選択肢（2〜6個）</label>
        <div id="choice-options"></div>
        <button class="btn-add-option" onclick="addChoiceOption()">＋ 選択肢を追加</button>
      </div>
      <div class="form-group">
        <label class="required">正解の選択肢</label>
        <select id="choice-answer">
          <option value="">選択してください</option>
        </select>
      </div>`;
    const opts = Array.isArray(quiz?.options) && quiz.options.length ? quiz.options : ['','','',''];
    document.getElementById('choice-options').innerHTML = '';
    opts.forEach(v => addChoiceOption(v));
    setTimeout(() => {
      updateChoiceAnswerSelect();
      if (quiz?.answer) document.getElementById('choice-answer').value = quiz.answer;
    }, 0);
  } else if (type === 'truefalse') {
    const ans = quiz?.answer;
    el.innerHTML = `
      <div class="form-group">
        <label class="required">正解</label>
        <div class="truefalse-btns">
          <button type="button" id="tf-true" class="tf-btn${ans==='true'?' selected-true':''}" onclick="selectTF('true')">○ 正しい</button>
          <button type="button" id="tf-false" class="tf-btn${ans==='false'?' selected-false':''}" onclick="selectTF('false')">× 間違い</button>
        </div>
        <input type="hidden" id="tf-answer" value="${ans||''}" />
      </div>`;
  } else if (type === 'manual') {
    el.innerHTML = `
      <div class="form-group">
        <label>参考URL・備考（任意）</label>
        <input type="text" id="f-ref" placeholder="参考になるURLや補足を入力" value="${esc(quiz?.options?.[0]||'')}" />
        <p class="hint">スタッフが回答を自由記述します。管理者が手動採点できます。</p>
      </div>`;
  } else {
    el.innerHTML = '';
  }
}

function onQuestionInput() {
  const type = document.getElementById('f-type').value;
  if (type === 'fill') syncFillAnswers();
}

function syncFillAnswers() {
  const q = document.getElementById('f-question').value;
  const count = (q.match(/___/g) || []).length;
  const container = document.getElementById('fill-answers');
  if (!container) return;
  const current = container.querySelectorAll('.fill-answer-row').length;
  if (count > current) {
    for (let i = current; i < count; i++) addFillAnswer(i+1, '');
  } else if (count < current) {
    const rows = container.querySelectorAll('.fill-answer-row');
    for (let i = count; i < current; i++) rows[i].remove();
  }
  container.querySelectorAll('.fill-answer-row label').forEach((lbl, i) => {
    lbl.textContent = `空欄${i+1}:`;
  });
}

function addFillAnswer(num, val='') {
  const container = document.getElementById('fill-answers');
  if (!container) return;
  const n = num || container.querySelectorAll('.fill-answer-row').length + 1;
  const row = document.createElement('div');
  row.className = 'fill-answer-row';
  row.innerHTML = `<label>空欄${n}:</label><input type="text" class="fill-ans" placeholder="答え${n}" value="${esc(val)}" />`;
  container.appendChild(row);
}

function addSortItem(val='') {
  const container = document.getElementById('sort-items');
  const row = document.createElement('div');
  row.className = 'option-row';
  row.innerHTML = `<input type="text" class="sort-item" placeholder="項目を入力" value="${esc(val)}" />
    <button class="btn-remove" onclick="this.parentElement.remove()">×</button>`;
  container.appendChild(row);
}

function addChoiceOption(val='') {
  const container = document.getElementById('choice-options');
  const row = document.createElement('div');
  row.className = 'option-row';
  row.innerHTML = `<input type="text" class="choice-opt" placeholder="選択肢を入力" value="${esc(val)}" oninput="updateChoiceAnswerSelect()" />
    <button class="btn-remove" onclick="this.parentElement.remove();updateChoiceAnswerSelect()">×</button>`;
  container.appendChild(row);
  updateChoiceAnswerSelect();
}

function updateChoiceAnswerSelect() {
  const sel = document.getElementById('choice-answer');
  if (!sel) return;
  const cur = sel.value;
  const opts = [...document.querySelectorAll('#choice-options .choice-opt')].map(i => i.value.trim()).filter(Boolean);
  sel.innerHTML = '<option value="">正解を選んでください</option>' +
    opts.map(o => `<option value="${esc(o)}"${o===cur?' selected':''}>${esc(o)}</option>`).join('');
}

function selectTF(val) {
  document.getElementById('tf-answer').value = val;
  document.getElementById('tf-true').className = 'tf-btn' + (val==='true'?' selected-true':'');
  document.getElementById('tf-false').className = 'tf-btn' + (val==='false'?' selected-false':'');
}

function collectFormData() {
  const type = document.getElementById('f-type').value;
  const title = document.getElementById('f-title').value.trim();
  const question = document.getElementById('f-question').value.trim();
  const explanation = document.getElementById('f-explanation').value.trim();

  if (!type) { alert('種類を選択してください'); return null; }
  if (!title) { alert('タイトルを入力してください'); return null; }
  if (!question) { alert('問題文を入力してください'); return null; }

  let options = [], answer = '';

  if (type === 'fill') {
    const inputs = document.querySelectorAll('#fill-answers .fill-ans');
    answer = [...inputs].map(i => i.value.trim());
    if (answer.some(a => !a)) { alert('答えをすべて入力してください'); return null; }
  } else if (type === 'sort') {
    options = [...document.querySelectorAll('#sort-items .sort-item')].map(i => i.value.trim()).filter(Boolean);
    if (options.length < 2) { alert('項目を2つ以上入力してください'); return null; }
    answer = options;
  } else if (type === 'choice') {
    options = [...document.querySelectorAll('#choice-options .choice-opt')].map(i => i.value.trim()).filter(Boolean);
    answer = document.getElementById('choice-answer').value;
    if (options.length < 2) { alert('選択肢を2つ以上入力してください'); return null; }
    if (!answer) { alert('正解を選択してください'); return null; }
  } else if (type === 'truefalse') {
    answer = document.getElementById('tf-answer').value;
    if (!answer) { alert('正解を選択してください（○または×）'); return null; }
  } else if (type === 'manual') {
    const ref = document.getElementById('f-ref')?.value.trim() || '';
    options = ref ? [ref] : [];
  }

  return { type, title, question, options, answer, explanation };
}

// ===== 新規作成 =====

function initCreateForm() {
  document.getElementById('create-form-inner').innerHTML = buildForm(null);
}

function resetCreateForm() {
  initCreateForm();
}

function submitCreate() {
  const data = collectFormData();
  if (!data) return;
  fetch('/api/quizzes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: authHeader },
    body: JSON.stringify(data),
  }).then(r => r.json()).then(q => {
    alert(`「${q.title}」を作成しました`);
    resetCreateForm();
    loadQuizzes();
    showTab('tab-list');
  });
}

// ===== 編集モーダル =====

function openEditModal(id) {
  editingId = id;
  const quiz = allQuizzes.find(q => q.id === id);
  if (!quiz) return;
  const inner = document.getElementById('edit-form-inner');
  inner.innerHTML = buildForm(quiz);
  // type-selectorはbuildForm内でtype選択済みなので、extraも描画
  renderTypeExtra(quiz.type, quiz);
  document.getElementById('edit-modal').classList.remove('hidden');
}

function closeEditModal() {
  document.getElementById('edit-modal').classList.add('hidden');
  editingId = null;
}

function submitEdit() {
  if (!editingId) return;
  const data = collectFormData();
  if (!data) return;
  fetch(`/api/quizzes/${editingId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', Authorization: authHeader },
    body: JSON.stringify(data),
  }).then(r => r.json()).then(() => {
    closeEditModal();
    loadQuizzes();
    alert('保存しました');
  });
}

// ===== 回答記録 =====

function loadSubs() {
  fetch('/api/quiz-subs', { headers: { Authorization: authHeader } })
    .then(r => r.json()).then(data => { allSubs = data; renderSubs(); });
}

function renderSubs() {
  const staffFilter = document.getElementById('filter-staff').value.trim().toLowerCase();
  const typeFilter = document.getElementById('filter-type').value;
  const resultFilter = document.getElementById('filter-result').value;

  let data = allSubs;
  if (staffFilter) data = data.filter(s => s.staffName.toLowerCase().includes(staffFilter));
  if (typeFilter) data = data.filter(s => s.quizType === typeFilter);
  if (resultFilter === 'correct') data = data.filter(s => s.isCorrect === true);
  else if (resultFilter === 'wrong') data = data.filter(s => s.isCorrect === false);
  else if (resultFilter === 'pending') data = data.filter(s => s.isCorrect === null);

  const tbody = document.getElementById('subs-tbody');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">該当する記録がありません</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(s => {
    const dt = new Date(s.submittedAt).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const ans = Array.isArray(s.userAnswer) ? s.userAnswer.join(' → ') : String(s.userAnswer||'');
    const displayAns = ans.length > 30 ? ans.slice(0,30)+'…' : ans;
    let resultHtml;
    if (s.isCorrect === true) resultHtml = '<span class="correct">✓ 正解</span>';
    else if (s.isCorrect === false) resultHtml = '<span class="wrong">✗ 不正解</span>';
    else resultHtml = '<span class="pending">未採点</span>';

    const gradeBtn = s.quizType === 'manual' ? `
      <div class="grade-manual">
        <button class="btn-correct" onclick="gradeManual('${s.id}',true)">○</button>
        <button class="btn-wrong" onclick="gradeManual('${s.id}',false)">×</button>
      </div>` : '';

    return `<tr>
      <td style="white-space:nowrap;color:#94a3b8">${dt}</td>
      <td><strong>${esc(s.staffName)}</strong></td>
      <td title="${esc(s.quizTitle)}">${esc(s.quizTitle.length>20?s.quizTitle.slice(0,20)+'…':s.quizTitle)}</td>
      <td>${typeBadge(s.quizType)}</td>
      <td style="color:#475569" title="${esc(ans)}">${esc(displayAns)}</td>
      <td>${resultHtml}</td>
      <td>${gradeBtn}</td>
    </tr>`;
  }).join('');
}

function gradeManual(id, isCorrect) {
  fetch(`/api/quiz-subs/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', Authorization: authHeader },
    body: JSON.stringify({ isCorrect }),
  }).then(() => loadSubs());
}

// ===== ユーティリティ =====

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// type選択時のイベント（モーダル内も含む）
document.addEventListener('click', e => {
  const opt = e.target.closest('.type-option');
  if (!opt) return;
  const container = opt.closest('.type-selector');
  const type = opt.dataset.type;
  container.querySelectorAll('.type-option').forEach(el => el.classList.remove('selected'));
  opt.classList.add('selected');
  const hiddenInput = container.closest('[id]').querySelector('#f-type') ||
                      document.getElementById('f-type');
  if (hiddenInput) hiddenInput.value = type;
  renderTypeExtra(type);
});
</script>
