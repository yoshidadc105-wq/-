<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スタッフクイズ | のびのび歯科</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic Pro","Meiryo",sans-serif;background:#f0fdf4;color:#1e293b;font-size:15px;min-height:100vh}
header{background:#16a34a;color:#fff;padding:14px 20px;text-align:center}
header h1{font-size:18px;font-weight:bold}
header p{font-size:12px;opacity:.85;margin-top:3px}
.container{max-width:680px;margin:0 auto;padding:20px 16px 60px}

/* スタッフ名入力 */
.name-wrap{display:flex;align-items:center;justify-content:center;min-height:60vh}
.name-card{background:#fff;border-radius:14px;padding:40px 32px;box-shadow:0 2px 12px rgba(0,0,0,.1);width:100%;max-width:360px;text-align:center}
.name-card h2{font-size:20px;color:#16a34a;margin-bottom:8px}
.name-card p{color:#64748b;font-size:13px;margin-bottom:24px}
.name-card input{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:11px 14px;font-size:16px;outline:none;margin-bottom:14px;text-align:center}
.name-card input:focus{border-color:#16a34a}

/* ボタン共通 */
.btn-green{background:#16a34a;color:#fff;border:none;border-radius:10px;padding:13px 24px;font-size:15px;font-weight:bold;cursor:pointer;width:100%;transition:background .2s}
.btn-green:hover{background:#15803d}
.btn-green:disabled{background:#86efac;cursor:not-allowed}
.btn-outline{background:#fff;color:#16a34a;border:2px solid #16a34a;border-radius:10px;padding:11px 24px;font-size:15px;font-weight:bold;cursor:pointer;width:100%;transition:all .2s;margin-top:10px}
.btn-outline:hover{background:#f0fdf4}

/* クイズ一覧 */
.staff-bar{background:#fff;border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.staff-bar strong{color:#16a34a}
.staff-bar button{background:none;border:1px solid #cbd5e1;border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer;color:#64748b}

.section-title{font-size:13px;color:#64748b;font-weight:bold;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.quiz-grid{display:flex;flex-direction:column;gap:10px}
.quiz-card{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer;border:2px solid transparent;transition:all .2s;display:flex;align-items:center;gap:14px}
.quiz-card:hover{border-color:#16a34a;background:#f0fdf4}
.quiz-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.icon-fill{background:#dbeafe}
.icon-sort{background:#fce7f3}
.icon-choice{background:#d1fae5}
.icon-truefalse{background:#fef3c7}
.icon-manual{background:#ede9fe}
.quiz-info{flex:1}
.quiz-title{font-size:15px;font-weight:bold;color:#1e293b;margin-bottom:3px}
.quiz-meta{font-size:12px;color:#94a3b8}
.type-tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:bold;margin-right:6px}
.tag-fill{background:#dbeafe;color:#1d4ed8}
.tag-sort{background:#fce7f3;color:#9d174d}
.tag-choice{background:#d1fae5;color:#065f46}
.tag-truefalse{background:#fef3c7;color:#92400e}
.tag-manual{background:#ede9fe;color:#5b21b6}
.empty-list{text-align:center;padding:60px 20px;color:#94a3b8}
.empty-list p{font-size:15px;margin-top:10px}

/* クイズプレイヤー */
.player-header{background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.player-type{font-size:12px;color:#16a34a;font-weight:bold;margin-bottom:6px}
.player-title{font-size:18px;font-weight:bold;color:#1e293b;margin-bottom:4px}
.player-question{font-size:15px;color:#374151;margin-top:12px;line-height:1.7;white-space:pre-wrap}

.answer-area{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.answer-label{font-size:13px;font-weight:bold;color:#374151;margin-bottom:12px}

/* 穴埋め */
.fill-question{font-size:15px;line-height:2.2;color:#1e293b}
.fill-input{border:none;border-bottom:2px solid #16a34a;background:#f0fdf4;border-radius:4px 4px 0 0;padding:2px 8px;font-size:15px;width:120px;outline:none;text-align:center;color:#16a34a;font-weight:bold}
.fill-input:focus{background:#dcfce7;border-bottom-color:#15803d}

/* 並び替え */
.sort-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.sort-item{background:#f8fafc;border:2px solid #e2e8f0;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;user-select:none}
.sort-item .sort-handle{display:flex;flex-direction:column;gap:2px;cursor:pointer}
.sort-item .up-btn,.sort-item .down-btn{background:none;border:1px solid #cbd5e1;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:12px;color:#64748b}
.sort-item .up-btn:hover,.sort-item .down-btn:hover{background:#e2e8f0}
.sort-item .item-text{flex:1;font-size:14px;color:#1e293b}
.sort-item .item-num{width:24px;height:24px;background:#16a34a;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;flex-shrink:0}

/* 選択式 */
.choice-list{display:flex;flex-direction:column;gap:10px}
.choice-btn{border:2px solid #e2e8f0;border-radius:10px;padding:14px 16px;text-align:left;cursor:pointer;font-size:14px;background:#fff;color:#1e293b;transition:all .2s;width:100%}
.choice-btn:hover{border-color:#16a34a;background:#f0fdf4}
.choice-btn.selected{border-color:#16a34a;background:#dcfce7;font-weight:bold;color:#15803d}

/* マルバツ */
.tf-list{display:flex;gap:12px}
.tf-btn{flex:1;padding:24px 16px;border:2px solid #e2e8f0;border-radius:14px;font-size:32px;cursor:pointer;background:#fff;text-align:center;transition:all .2s}
.tf-btn:hover{transform:scale(1.03)}
.tf-btn.tf-selected-true{border-color:#16a34a;background:#dcfce7}
.tf-btn.tf-selected-false{border-color:#dc2626;background:#fee2e2}
.tf-label{font-size:13px;font-weight:bold;margin-top:6px;display:block}

/* マニュアル */
.manual-textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:12px;font-size:14px;font-family:inherit;min-height:120px;resize:vertical;outline:none}
.manual-textarea:focus{border-color:#16a34a}
.ref-link{display:inline-block;margin-top:8px;color:#16a34a;font-size:13px;text-decoration:underline}

/* 結果画面 */
.result-card{background:#fff;border-radius:14px;padding:28px 24px;box-shadow:0 2px 12px rgba(0,0,0,.1);text-align:center}
.result-icon{font-size:64px;margin-bottom:12px}
.result-title{font-size:22px;font-weight:bold;margin-bottom:6px}
.result-correct{color:#16a34a}
.result-wrong{color:#dc2626}
.result-pending{color:#7c3aed}
.explanation-box{background:#f0fdf4;border-left:4px solid #16a34a;border-radius:8px;padding:14px 16px;margin:16px 0;text-align:left;font-size:14px;line-height:1.7;color:#374151}
.correct-ans-box{background:#fef3c7;border-left:4px solid #f59e0b;border-radius:8px;padding:12px 16px;margin:12px 0;text-align:left;font-size:13px;color:#92400e}
.correct-ans-box strong{display:block;margin-bottom:4px;font-size:12px;color:#78350f}

@media(max-width:480px){
  .name-card{padding:28px 20px}
  .tf-btn{padding:20px 10px;font-size:28px}
  .fill-input{width:90px}
}
</style>
</head>
<body>

<header>
  <h1>📋 スタッフクイズ</h1>
  <p>のびのび歯科・矯正歯科</p>
</header>

<!-- スタッフ名入力 -->
<div id="name-screen" style="display:flex;align-items:center;justify-content:center;min-height:70vh;padding:20px">
  <div class="name-card">
    <h2>こんにちは！</h2>
    <p>始める前にお名前を入力してください</p>
    <input type="text" id="staff-name-input" placeholder="例: 山田 花子" />
    <button class="btn-green" onclick="startApp()">スタート</button>
  </div>
</div>

<!-- メインアプリ -->
<div id="main-app" style="display:none">
  <div class="container">

    <!-- スタッフバー -->
    <div class="staff-bar">
      <div>こんにちは、<strong id="staff-name-display"></strong> さん</div>
      <button onclick="changeName()">名前を変更</button>
    </div>

    <!-- 問題一覧 -->
    <div id="screen-list">
      <p class="section-title">問題を選んでください</p>
      <div class="quiz-grid" id="quiz-list-inner">
        <div class="empty-list">
          <div style="font-size:40px">📭</div>
          <p>読み込み中...</p>
        </div>
      </div>
    </div>

    <!-- クイズプレイヤー -->
    <div id="screen-player" style="display:none">
      <div class="player-header">
        <div class="player-type" id="p-type-label"></div>
        <div class="player-title" id="p-title"></div>
        <div class="player-question" id="p-question"></div>
      </div>

      <div class="answer-area">
        <div class="answer-label">回答してください</div>
        <div id="p-answer-ui"></div>
      </div>

      <button class="btn-green" id="submit-btn" onclick="submitAnswer()">回答する</button>
      <button class="btn-outline" onclick="backToList()">← 一覧に戻る</button>
    </div>

    <!-- 結果画面 -->
    <div id="screen-result" style="display:none">
      <div class="result-card">
        <div class="result-icon" id="r-icon"></div>
        <div class="result-title" id="r-title"></div>
        <div id="r-correct-ans"></div>
        <div id="r-explanation"></div>
      </div>
      <button class="btn-green" style="margin-top:16px" onclick="backToList()">← 問題一覧に戻る</button>
    </div>

  </div>
</div>

<script>
let staffName = '';
let currentQuiz = null;
let allQuizzes = [];

// ===== スタッフ名 =====

document.getElementById('staff-name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') startApp();
});

function startApp() {
  const name = document.getElementById('staff-name-input').value.trim();
  if (!name) { alert('お名前を入力してください'); return; }
  staffName = name;
  document.getElementById('name-screen').style.display = 'none';
  document.getElementById('main-app').style.display = 'block';
  document.getElementById('staff-name-display').textContent = name;
  loadQuizList();
}

function changeName() {
  document.getElementById('staff-name-input').value = staffName;
  document.getElementById('name-screen').style.display = 'flex';
  document.getElementById('main-app').style.display = 'none';
}

// ===== 問題一覧 =====

function loadQuizList() {
  fetch('/api/quizzes')
    .then(r => r.json())
    .then(data => { allQuizzes = data; renderList(); });
}

const typeInfo = {
  fill:      { icon: '✏️', label: '穴埋め',   cls: 'icon-fill',      tag: 'tag-fill' },
  sort:      { icon: '🔀', label: '並び替え', cls: 'icon-sort',      tag: 'tag-sort' },
  choice:    { icon: '📌', label: '選択式',   cls: 'icon-choice',    tag: 'tag-choice' },
  truefalse: { icon: '⭕', label: 'マルバツ', cls: 'icon-truefalse', tag: 'tag-truefalse' },
  manual:    { icon: '📝', label: 'マニュアル', cls: 'icon-manual',  tag: 'tag-manual' },
};

function renderList() {
  const el = document.getElementById('quiz-list-inner');
  if (!allQuizzes.length) {
    el.innerHTML = '<div class="empty-list"><div style="font-size:40px">📭</div><p>問題がまだありません</p></div>';
    return;
  }
  el.innerHTML = allQuizzes.map(q => {
    const t = typeInfo[q.type] || { icon:'❓', label:q.type, cls:'', tag:'' };
    return `<div class="quiz-card" onclick="startQuiz('${q.id}')">
      <div class="quiz-icon ${t.cls}">${t.icon}</div>
      <div class="quiz-info">
        <div class="quiz-title">${esc(q.title)}</div>
        <div class="quiz-meta">
          <span class="type-tag ${t.tag}">${t.label}</span>
        </div>
      </div>
      <div style="color:#cbd5e1;font-size:20px">›</div>
    </div>`;
  }).join('');
}

// ===== クイズプレイヤー =====

function startQuiz(id) {
  currentQuiz = allQuizzes.find(q => q.id === id);
  if (!currentQuiz) return;
  showScreen('screen-player');

  const t = typeInfo[currentQuiz.type] || {};
  document.getElementById('p-type-label').textContent = `${t.icon||''} ${t.label||currentQuiz.type}`;
  document.getElementById('p-title').textContent = currentQuiz.title;

  buildAnswerUI();
}

function buildAnswerUI() {
  const q = currentQuiz;
  const qEl = document.getElementById('p-question');
  const ui = document.getElementById('p-answer-ui');

  if (q.type === 'fill') {
    // 問題文の___ をinputに置換
    const parts = q.question.split('___');
    qEl.innerHTML = '';
    parts.forEach((part, i) => {
      qEl.appendChild(document.createTextNode(part));
      if (i < parts.length - 1) {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'fill-input';
        inp.dataset.idx = i;
        inp.placeholder = `${i+1}`;
        qEl.appendChild(inp);
      }
    });
    ui.innerHTML = `<p style="font-size:12px;color:#94a3b8">空欄に入力してください</p>`;
  } else if (q.type === 'sort') {
    qEl.textContent = q.question;
    const shuffled = [...q.options].sort(() => Math.random() - 0.5);
    ui.innerHTML = `<ul class="sort-list" id="sort-list">${shuffled.map((item, i) =>
      `<li class="sort-item" data-val="${esc(item)}">
        <span class="item-num">${i+1}</span>
        <span class="item-text">${esc(item)}</span>
        <div class="sort-handle">
          <button class="up-btn" onclick="moveItem(this,-1)">▲</button>
          <button class="down-btn" onclick="moveItem(this,1)">▼</button>
        </div>
      </li>`).join('')}</ul>`;
    updateSortNumbers();
  } else if (q.type === 'choice') {
    qEl.textContent = q.question;
    ui.innerHTML = `<div class="choice-list">${q.options.map(opt =>
      `<button class="choice-btn" onclick="selectChoice(this,'${esc(opt)}')">${esc(opt)}</button>`
    ).join('')}</div>`;
  } else if (q.type === 'truefalse') {
    qEl.textContent = q.question;
    ui.innerHTML = `<div class="tf-list">
      <div class="tf-btn" onclick="selectTF(this,'true')">⭕<span class="tf-label">正しい</span></div>
      <div class="tf-btn" onclick="selectTF(this,'false')">❌<span class="tf-label">間違い</span></div>
    </div>`;
  } else if (q.type === 'manual') {
    qEl.textContent = q.question;
    const ref = q.options && q.options[0] ? `<a href="${esc(q.options[0])}" target="_blank" class="ref-link">📎 参考リンク</a>` : '';
    ui.innerHTML = `<textarea class="manual-textarea" id="manual-ans" placeholder="自由に回答を記入してください"></textarea>${ref}`;
  }
}

function moveItem(btn, dir) {
  const li = btn.closest('li');
  const ul = li.parentElement;
  const items = [...ul.children];
  const idx = items.indexOf(li);
  const target = items[idx + dir];
  if (!target) return;
  if (dir === -1) ul.insertBefore(li, target);
  else ul.insertBefore(target, li);
  updateSortNumbers();
}

function updateSortNumbers() {
  document.querySelectorAll('#sort-list .sort-item').forEach((li, i) => {
    li.querySelector('.item-num').textContent = i + 1;
  });
}

function selectChoice(btn, val) {
  document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  btn.dataset.val = val;
}

function selectTF(btn, val) {
  document.querySelectorAll('.tf-btn').forEach(b => {
    b.classList.remove('tf-selected-true','tf-selected-false');
  });
  btn.classList.add(val === 'true' ? 'tf-selected-true' : 'tf-selected-false');
  btn.dataset.selected = val;
}

function collectAnswer() {
  const q = currentQuiz;
  if (q.type === 'fill') {
    const inputs = document.querySelectorAll('#p-question .fill-input');
    const vals = [...inputs].map(i => i.value.trim());
    if (vals.some(v => !v)) { alert('すべての空欄を埋めてください'); return null; }
    return vals;
  } else if (q.type === 'sort') {
    return [...document.querySelectorAll('#sort-list .sort-item')].map(li => li.dataset.val);
  } else if (q.type === 'choice') {
    const sel = document.querySelector('.choice-btn.selected');
    if (!sel) { alert('選択肢を選んでください'); return null; }
    return sel.dataset.val;
  } else if (q.type === 'truefalse') {
    const sel = document.querySelector('.tf-btn[data-selected]');
    if (!sel) { alert('○か×を選んでください'); return null; }
    return sel.dataset.selected;
  } else if (q.type === 'manual') {
    const val = document.getElementById('manual-ans').value.trim();
    if (!val) { alert('回答を入力してください'); return null; }
    return val;
  }
  return null;
}

function submitAnswer() {
  const userAnswer = collectAnswer();
  if (userAnswer === null) return;

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '送信中...';

  fetch(`/api/quizzes/${currentQuiz.id}/submit`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ staffName, userAnswer }),
  })
  .then(r => r.json())
  .then(result => {
    btn.disabled = false;
    btn.textContent = '回答する';
    showResult(result);
  })
  .catch(() => {
    btn.disabled = false;
    btn.textContent = '回答する';
    alert('送信に失敗しました。再度お試しください。');
  });
}

function showResult(result) {
  showScreen('screen-result');

  const iconEl = document.getElementById('r-icon');
  const titleEl = document.getElementById('r-title');
  const ansEl = document.getElementById('r-correct-ans');
  const expEl = document.getElementById('r-explanation');

  if (result.isCorrect === true) {
    iconEl.textContent = '🎉';
    titleEl.textContent = '正解！';
    titleEl.className = 'result-title result-correct';
  } else if (result.isCorrect === false) {
    iconEl.textContent = '😔';
    titleEl.textContent = '不正解...';
    titleEl.className = 'result-title result-wrong';
  } else {
    iconEl.textContent = '📨';
    titleEl.textContent = '回答を送信しました';
    titleEl.className = 'result-title result-pending';
  }

  // 正解を表示（間違いの場合のみ）
  if (result.isCorrect === false && result.correctAnswer !== undefined) {
    const correct = Array.isArray(result.correctAnswer)
      ? result.correctAnswer.join(' → ')
      : String(result.correctAnswer === 'true' ? '○ 正しい' : result.correctAnswer === 'false' ? '× 間違い' : result.correctAnswer);
    ansEl.innerHTML = `<div class="correct-ans-box"><strong>正解</strong>${esc(correct)}</div>`;
  } else {
    ansEl.innerHTML = '';
  }

  // 解説
  if (result.explanation) {
    expEl.innerHTML = `<div class="explanation-box">💡 ${esc(result.explanation)}</div>`;
  } else if (result.isCorrect === null) {
    expEl.innerHTML = `<div class="explanation-box" style="background:#faf5ff;border-color:#7c3aed;color:#5b21b6">📋 管理者が採点します。お疲れ様でした！</div>`;
  } else {
    expEl.innerHTML = '';
  }
}

// ===== ナビゲーション =====

function showScreen(id) {
  ['screen-list','screen-player','screen-result'].forEach(s => {
    document.getElementById(s).style.display = s === id ? 'block' : 'none';
  });
}

function backToList() {
  currentQuiz = null;
  showScreen('screen-list');
  loadQuizList();
}

// ===== ユーティリティ =====

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
