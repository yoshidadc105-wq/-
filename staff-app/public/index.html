<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スタッフ実績入力 | のびのび歯科</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Hiragino Kaku Gothic Pro", "Meiryo", sans-serif; background: #f4f7f9; color: #333; font-size: 15px; line-height: 1.6; }
    header { background: #2aab96; color: #fff; padding: 16px 20px; text-align: center; }
    header h1 { font-size: 18px; font-weight: bold; }
    header p { font-size: 12px; margin-top: 4px; opacity: .85; }
    .container { max-width: 560px; margin: 20px auto; padding: 0 16px 60px; }
    .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 20px; margin-bottom: 16px; }
    .card-title { font-size: 14px; font-weight: bold; color: #fff; background: #2aab96; border-radius: 6px; padding: 5px 12px; margin-bottom: 14px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; font-weight: bold; }
    .required::after { content: "必須"; font-size: 11px; color: #fff; background: #e05; border-radius: 3px; padding: 1px 5px; margin-left: 6px; font-weight: normal; }
    input[type="text"], input[type="date"], select, textarea {
      width: 100%; border: 1px solid #ccc; border-radius: 6px; padding: 9px 12px;
      font-size: 15px; font-family: inherit; outline: none; transition: border .2s; background: #fff;
    }
    input:focus, select:focus, textarea:focus { border-color: #2aab96; }
    textarea { resize: vertical; min-height: 80px; }
    .row2 { display: flex; gap: 10px; }
    .row2 > * { flex: 1; }
    .patient-check { font-size: 12px; margin-top: 4px; min-height: 18px; }
    .check-ok { color: #059669; }
    .check-ng { color: #dc2626; font-weight: bold; }

    /* 実施内容セレクター */
    .item-add-row { display: flex; gap: 8px; align-items: flex-start; }
    .item-add-row select { flex: 1; }
    .add-btn { background: #2aab96; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: bold; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .add-btn:hover { background: #228f7c; }
    .other-input-wrap { margin-top: 8px; display: none; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; min-height: 24px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; background: #e8f7f5; border: 1px solid #2aab96; color: #065f46; border-radius: 20px; padding: 4px 12px; font-size: 13px; }
    .tag-counseling { background: #dbeafe; border-color: #3b82f6; color: #1e40af; }
    .tag-review    { background: #fce7f3; border-color: #ec4899; color: #9d174d; }
    .tag-item      { background: #fef3c7; border-color: #f59e0b; color: #92400e; }
    .tag-other     { background: #f3e8ff; border-color: #a855f7; color: #6b21a8; }
    .tag-remove { cursor: pointer; font-size: 14px; line-height: 1; opacity: .6; }
    .tag-remove:hover { opacity: 1; }
    .empty-tags { font-size: 12px; color: #9ca3af; margin-top: 6px; }

    .submit-btn { display: block; width: 100%; background: #2aab96; color: #fff; border: none; border-radius: 30px; padding: 14px; font-size: 17px; font-weight: bold; cursor: pointer; transition: background .2s; }
    .submit-btn:hover { background: #228f7c; }
    .submit-btn:disabled { background: #aaa; cursor: not-allowed; }
    #success { display: none; text-align: center; padding: 36px 20px; }
    #success .icon { font-size: 56px; }
    #success h2 { font-size: 20px; color: #2aab96; margin: 14px 0 8px; }
    #success p { color: #666; font-size: 14px; }
    #success .again-btn { display: inline-block; margin-top: 16px; background: #2aab96; color: #fff; border: none; border-radius: 20px; padding: 10px 28px; font-size: 15px; cursor: pointer; }
    .recent-section { margin-top: 10px; }
    .recent-title { font-size: 14px; font-weight: bold; color: #065f46; margin-bottom: 10px; border-left: 4px solid #2aab96; padding-left: 8px; }
    .record-item { background: #fff; border-radius: 8px; border: 1px solid #e5e7eb; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; }
    .record-item .staff-name { font-weight: bold; color: #2aab96; }
    .record-item .record-detail { color: #555; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
    .record-item .record-date { font-size: 11px; color: #9ca3af; float: right; }
    .badge { display: inline-block; border-radius: 4px; padding: 1px 7px; font-size: 11px; }
    .loading { text-align: center; color: #9ca3af; padding: 20px; font-size: 13px; }
  </style>
</head>
<body>
<header>
  <h1>スタッフ実績入力</h1>
  <p>のびのび歯科・矯正歯科</p>
</header>
<div class="container">

  <div id="success" class="card">
    <div class="icon">✅</div>
    <h2>登録しました</h2>
    <p>実績を記録しました。</p>
    <button class="again-btn" onclick="resetForm()">続けて入力する</button>
  </div>

  <form id="staff-form">
    <!-- 基本情報 -->
    <div class="card">
      <div class="card-title">基本情報</div>
      <div class="row2">
        <div class="form-group">
          <label class="required">日付</label>
          <input type="date" name="date" id="dateInput" required />
        </div>
        <div class="form-group">
          <label class="required">スタッフ名</label>
          <input type="text" name="staffName" placeholder="例：田中" required />
        </div>
      </div>
      <div class="form-group">
        <label class="required">患者番号</label>
        <input type="text" name="patientNo" id="patientNo" placeholder="例：P-1234" required autocomplete="off" />
        <div class="patient-check" id="patientCheck"></div>
      </div>
    </div>

    <!-- 実施内容（統合プルダウン） -->
    <div class="card">
      <div class="card-title">実施内容</div>
      <div class="form-group">
        <label>項目を選んで追加してください</label>
        <div class="item-add-row">
          <select id="itemSelect">
            <optgroup label="── 実績 ──">
              <option value="">選択してください</option>
              <option value="物品販売" data-type="item">物品販売</option>
              <option value="口コミ獲得" data-type="review">口コミ獲得</option>
            </optgroup>
            <optgroup label="── カウンセリング成約 ──">
              <option value="インプラント" data-type="counseling">インプラント</option>
              <option value="ワイヤー矯正" data-type="counseling">ワイヤー矯正</option>
              <option value="マウスピース矯正" data-type="counseling">マウスピース矯正</option>
              <option value="ホワイトニング" data-type="counseling">ホワイトニング</option>
              <option value="セラミック・審美" data-type="counseling">セラミック・審美</option>
              <option value="入れ歯・義歯" data-type="counseling">入れ歯・義歯</option>
              <option value="歯周病治療" data-type="counseling">歯周病治療</option>
              <option value="予防・定期検診" data-type="counseling">予防・定期検診</option>
            </optgroup>
            <optgroup label="── 処置 ──">
              <option value="シーラント" data-type="treatment">シーラント</option>
              <option value="レントゲン" data-type="treatment">レントゲン</option>
              <option value="フッ素塗布" data-type="treatment">フッ素塗布</option>
              <option value="クリーニング" data-type="treatment">クリーニング</option>
              <option value="歯磨き指導(TBI)" data-type="treatment">歯磨き指導（TBI）</option>
            </optgroup>
            <optgroup label="── その他 ──">
              <option value="__other__" data-type="other">その他（自由記述）</option>
            </optgroup>
          </select>
          <button type="button" class="add-btn" onclick="addItem()">追加</button>
        </div>
        <div class="other-input-wrap" id="otherInputWrap">
          <input type="text" id="otherText" placeholder="内容を入力してください" />
        </div>
      </div>
      <div class="tags" id="tags"></div>
      <div class="empty-tags" id="emptyTags">まだ項目が追加されていません</div>
      <input type="hidden" name="selectedItems" id="selectedItemsInput" value="[]" />
    </div>

    <!-- 行動・取り組み -->
    <div class="card">
      <div class="card-title">行動・取り組み（自由記入）</div>
      <div class="form-group">
        <label>特記事項・頑張ったこと</label>
        <textarea name="freeText" id="freeText" placeholder="下のボタンから選ぶか、自由に入力してください"></textarea>
        <div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;" id="phraseButtons"></div>
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">実績を登録する</button>
  </form>

  <!-- 最近の入力一覧 -->
  <div class="recent-section" style="margin-top:24px">
    <div class="recent-title">みんなの最近の入力（直近50件）</div>
    <div id="recentList"><div class="loading">読み込み中...</div></div>
  </div>

</div>

<script>
  // 例文ボタン
  const PHRASES = [
    'だれよりもトイレ掃除を丁寧に行った',
    '患者さんに笑顔で対応できた',
    '毎日マニュアルを確認している',
    '院内の整理整頓を率先して行った',
    '患者さんのお名前を覚えて声かけした',
    'チームへの報連相を徹底した',
    '新人スタッフのサポートをした',
    '器具の準備・片付けを迅速に行った',
    '患者さんへの治療説明をわかりやすく行った',
    '時間に正確で遅刻ゼロだった',
    '自主的に勉強・スキルアップに取り組んだ',
    'クレームゼロで患者満足度を高めた',
    'チームの雰囲気づくりに貢献した',
  ];
  const phraseButtons = document.getElementById('phraseButtons');
  PHRASES.forEach(p => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = p;
    btn.style.cssText = 'background:#e8f7f5;border:1px solid #2aab96;color:#065f46;border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer;';
    btn.onclick = () => { document.getElementById('freeText').value = p; };
    phraseButtons.appendChild(btn);
  });

  document.getElementById('dateInput').value = new Date().toLocaleDateString('sv-SE');

  // その他選択時に入力欄を表示
  document.getElementById('itemSelect').addEventListener('change', function() {
    document.getElementById('otherInputWrap').style.display = this.value === '__other__' ? 'block' : 'none';
  });

  // タグ管理
  let selectedItems = [];

  const TYPE_CLASS = {
    item: 'tag-item',
    counseling: 'tag-counseling',
    review: 'tag-review',
    other: 'tag-other',
    treatment: '',
  };

  function renderTags() {
    const container = document.getElementById('tags');
    const empty = document.getElementById('emptyTags');
    container.innerHTML = '';
    empty.style.display = selectedItems.length ? 'none' : 'block';
    selectedItems.forEach((item, i) => {
      const tag = document.createElement('span');
      tag.className = 'tag ' + (TYPE_CLASS[item.type] || '');
      tag.innerHTML = `${item.label} <span class="tag-remove" onclick="removeItem(${i})">✕</span>`;
      container.appendChild(tag);
    });
    document.getElementById('selectedItemsInput').value = JSON.stringify(selectedItems);
  }

  function addItem() {
    const sel = document.getElementById('itemSelect');
    const opt = sel.options[sel.selectedIndex];
    if (!sel.value) return;

    let label = sel.value;
    let type = opt.dataset.type || 'treatment';

    if (sel.value === '__other__') {
      const text = document.getElementById('otherText').value.trim();
      if (!text) { document.getElementById('otherText').focus(); return; }
      label = text;
      type = 'other';
      document.getElementById('otherText').value = '';
      document.getElementById('otherInputWrap').style.display = 'none';
    }

    // 重複チェック（その他は重複OK）
    if (type !== 'other' && selectedItems.some(i => i.label === label)) {
      sel.value = '';
      return;
    }

    selectedItems.push({ label, type });
    sel.value = '';
    renderTags();
  }

  function removeItem(index) {
    selectedItems.splice(index, 1);
    renderTags();
  }

  renderTags();

  // 患者番号重複チェック
  let checkTimer;
  document.getElementById('patientNo').addEventListener('input', function() {
    clearTimeout(checkTimer);
    const val = this.value.trim();
    const el = document.getElementById('patientCheck');
    if (!val) { el.textContent = ''; return; }
    el.textContent = '確認中...';
    el.className = 'patient-check';
    checkTimer = setTimeout(async () => {
      try {
        const res = await fetch('/api/check-patient/' + encodeURIComponent(val));
        const data = await res.json();
        if (data.exists) {
          el.textContent = '⚠ この患者番号はすでに登録されています';
          el.className = 'patient-check check-ng';
        } else {
          el.textContent = '✓ 未登録です（入力可）';
          el.className = 'patient-check check-ok';
        }
      } catch { el.textContent = ''; }
    }, 500);
  });

  document.getElementById('staff-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '登録中...';
    const fd = new FormData(this);
    const data = {};
    for (const [k, v] of fd.entries()) data[k] = v;
    try {
      const res = await fetch('/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (res.status === 409) {
        const err = await res.json();
        alert(err.message);
        btn.disabled = false;
        btn.textContent = '実績を登録する';
        return;
      }
      if (res.ok) {
        document.getElementById('staff-form').style.display = 'none';
        document.getElementById('success').style.display = 'block';
        window.scrollTo(0, 0);
        loadRecent();
      } else { throw new Error(); }
    } catch {
      alert('登録に失敗しました。再度お試しください。');
      btn.disabled = false;
      btn.textContent = '実績を登録する';
    }
  });

  function resetForm() {
    document.getElementById('staff-form').reset();
    document.getElementById('dateInput').value = new Date().toLocaleDateString('sv-SE');
    document.getElementById('patientCheck').textContent = '';
    selectedItems = [];
    renderTags();
    document.getElementById('otherInputWrap').style.display = 'none';
    document.getElementById('staff-form').style.display = '';
    document.getElementById('success').style.display = 'none';
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').textContent = '実績を登録する';
    window.scrollTo(0, 0);
  }

  async function loadRecent() {
    const list = document.getElementById('recentList');
    try {
      const res = await fetch('/api/records');
      const records = await res.json();
      if (!records.length) {
        list.innerHTML = '<div class="loading">まだ入力がありません</div>';
        return;
      }
      const TYPE_COLOR = {
        item:       'background:#fef3c7;color:#92400e',
        counseling: 'background:#dbeafe;color:#1e40af',
        review:     'background:#fce7f3;color:#9d174d',
        other:      'background:#f3e8ff;color:#6b21a8',
        treatment:  'background:#e8f7f5;color:#065f46',
      };
      list.innerHTML = records.map(r => {
        const items = JSON.parse(r.selectedItems || '[]');
        const badges = items.map(i =>
          `<span class="badge" style="${TYPE_COLOR[i.type] || TYPE_COLOR.treatment}">${i.label}</span>`
        ).join('');
        return `<div class="record-item">
          <span class="record-date">${r.date}</span>
          <span class="staff-name">${r.staffName}</span>
          <span style="color:#9ca3af;font-size:12px"> 患者:${r.patientNo}</span>
          <div class="record-detail">${badges || '<span style="color:#ccc;font-size:12px">記録なし</span>'}${r.freeText ? `<div style="font-size:12px;color:#555;width:100%;margin-top:2px">「${r.freeText}」</div>` : ''}</div>
        </div>`;
      }).join('');
    } catch {
      list.innerHTML = '<div class="loading">読み込みに失敗しました</div>';
    }
  }

  loadRecent();
</script>
</body>
</html>
