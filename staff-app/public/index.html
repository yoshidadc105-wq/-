<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自己申告デラックス | のびのび歯科</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="自己申告">
  <meta name="theme-color" content="#0f766e">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans JP', sans-serif; background: #071020; color: #e2e8f0; font-size: 15px; line-height: 1.6; min-height: 100vh; }

    /* ヘッダー */
    header { background: linear-gradient(135deg, #071020 0%, #0f2d3d 100%); padding: 0; border-bottom: 1px solid rgba(255,255,255,.08); }
    .header-inner { max-width: 560px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-icon { width: 40px; height: 40px; background: linear-gradient(135deg,#0f766e,#2aab96); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; box-shadow: 0 0 12px rgba(42,171,150,.4); }
    header h1 { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: .03em; }
    header p { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 1px; }
    #headerUser { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    .container { max-width: 560px; margin: 0 auto; padding: 20px 16px 80px; }

    /* カード */
    .card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 20px; margin-bottom: 14px; }
    .card-title { font-size: 11px; font-weight: 700; color: #2aab96; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
    .card-title::before { content: ''; display: block; width: 3px; height: 14px; background: linear-gradient(180deg, #2aab96, #34d399); border-radius: 2px; }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.6); margin-bottom: 5px; }
    .required::after { content: "必須"; font-size: 10px; color: #fff; background: linear-gradient(135deg,#ef4444,#f87171); border-radius: 3px; padding: 1px 5px; margin-left: 6px; font-weight: 600; }

    input[type="text"], select {
      width: 100%; border: 1.5px solid rgba(255,255,255,.1); border-radius: 10px; padding: 11px 14px;
      font-size: 15px; font-family: inherit; outline: none; transition: border .2s, box-shadow .2s;
      background: rgba(255,255,255,.06); color: #e2e8f0;
    }
    input:focus, select:focus { border-color: #2aab96; background: rgba(42,171,150,.08); box-shadow: 0 0 0 3px rgba(42,171,150,.15); }
    input[readonly] { background: rgba(255,255,255,.04); color: rgba(255,255,255,.5); cursor: default; border-color: rgba(255,255,255,.06); }
    select option { background: #0d2233; color: #e2e8f0; }
    select optgroup { color: #64748b; }

    .patient-check { font-size: 12px; margin-top: 4px; min-height: 18px; color: #2aab96; }
    .hidden { display: none; }

    .submit-btn {
      display: block; width: 100%;
      background: linear-gradient(135deg, #0f766e, #2aab96);
      color: #fff; border: none; border-radius: 14px; padding: 16px;
      font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer;
      transition: opacity .2s, transform .1s;
      box-shadow: 0 4px 20px rgba(42,171,150,.4);
      letter-spacing: .05em;
    }
    .submit-btn:hover { opacity: .9; }
    .submit-btn:active { transform: scale(.98); }
    .submit-btn:disabled { background: rgba(255,255,255,.1); color: rgba(255,255,255,.3); box-shadow: none; cursor: not-allowed; }

    /* 成功メッセージ */
    .success-msg { display: none; text-align: center; padding: 48px 20px; }
    .success-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #0f766e, #34d399); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 38px; margin: 0 auto 20px; box-shadow: 0 0 30px rgba(52,211,153,.5); animation: pop-in .4s cubic-bezier(.34,1.56,.64,1); }
    @keyframes pop-in { 0%{transform:scale(0)} 100%{transform:scale(1)} }
    .success-msg h2 { font-size: 22px; color: #34d399; font-weight: 900; margin-bottom: 8px; }
    .success-msg p { color: rgba(255,255,255,.6); font-size: 14px; }
    .again-btn { display: inline-block; margin-top: 24px; background: linear-gradient(135deg, #0f766e, #2aab96); color: #fff; border: none; border-radius: 30px; padding: 12px 36px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 4px 16px rgba(42,171,150,.4); }

    /* 実績リンク */
    .stats-link { display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(42,171,150,.12); color: #2aab96; border: 1px solid rgba(42,171,150,.3); border-radius: 12px; padding: 14px; font-size: 14px; font-weight: 700; text-decoration: none; transition: background .2s; margin-top: 16px; }
    .stats-link:hover { background: rgba(42,171,150,.2); }

    /* パスワードモーダル */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal-box { background: #0d2233; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 28px; max-width: 360px; width: 94%; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .modal-box h2 { font-size: 17px; font-weight: 700; color: #2aab96; margin-bottom: 18px; }
    .modal-box label { display: block; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.6); margin-bottom: 4px; }
    .modal-box input[type="password"] { width: 100%; border: 1.5px solid rgba(255,255,255,.1); border-radius: 8px; padding: 9px 12px; font-size: 14px; font-family: inherit; outline: none; background: rgba(255,255,255,.06); color: #e2e8f0; margin-bottom: 12px; }
    .modal-box input:focus { border-color: #2aab96; }
    .modal-btns { display: flex; gap: 8px; margin-top: 4px; }
    .modal-btns button { flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .modal-cancel { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); color: rgba(255,255,255,.7); }
    .modal-ok { background: linear-gradient(135deg,#0f766e,#2aab96); color: #fff; border: none; }

    .hdr-btn { background: rgba(255,255,255,.1); color: rgba(255,255,255,.8); border: 1px solid rgba(255,255,255,.15); border-radius: 8px; padding: 5px 11px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; text-decoration: none; white-space: nowrap; }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="header-left">
      <div class="header-icon">🦷</div>
      <div>
        <h1>自己申告デラックス</h1>
        <p>のびのび歯科・矯正歯科</p>
      </div>
    </div>
    <div id="headerUser"></div>
  </div>
</header>

<div class="container">

  <div id="successMsg" class="success-msg card">
    <div class="success-icon">✓</div>
    <h2>登録しました</h2>
    <p id="successText"></p>
    <button class="again-btn" onclick="resetForm()">続けて入力する</button>
  </div>

  <form id="mainForm">
    <div class="card">
      <div class="card-title">基本情報</div>
      <div class="form-group">
        <label class="required">日付</label>
        <input type="text" id="dateInput" name="date" required readonly />
      </div>
      <div class="form-group">
        <label class="required">スタッフ名</label>
        <input type="text" id="staffNameInput" name="staffName" readonly style="color:#2aab96;font-weight:700;" />
      </div>
    </div>

    <div class="card">
      <div class="card-title">実施内容</div>
      <div class="form-group">
        <label class="required">内容を選択</label>
        <select name="action" id="actionSelect" required onchange="onActionChange()">
          <option value="">選択してください</option>
        </select>
      </div>

      <div class="form-group hidden" id="patientNoWrap">
        <label class="required">患者番号</label>
        <input type="text" name="patientNo" id="patientNo" placeholder="例：1234" autocomplete="off" maxlength="10" />
        <div class="patient-check" id="patientCheck"></div>
      </div>

      <div class="form-group hidden" id="itemNameWrap">
        <label id="itemNameLabel">商品名</label>
        <input type="text" name="itemName" placeholder="例：電動歯ブラシ、ホワイトニングジェルなど" />
      </div>

      <div class="form-group hidden" id="countWrap">
        <label class="required" id="countLabel">件数</label>
        <input type="number" name="countValue" id="countValue" min="1" max="99" placeholder="例：3" style="width:100px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;padding:10px 14px;color:#e2e8f0;font-size:15px;font-family:inherit;outline:none" />
      </div>

      <div class="form-group hidden" id="typeWrap">
        <label class="required">種類</label>
        <select name="otherText" id="typeSelect">
          <option value="">選択してください</option>
        </select>
      </div>

      <div class="form-group hidden" id="freeTextWrap">
        <label class="required">具体的な内容</label>
        <input type="text" name="otherText" id="freeTextInput" placeholder="具体的にどんな行動をしたか..." maxlength="200" />
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">登録する</button>
  </form>

  <a href="/my-stats" class="stats-link">
    📊 自分の実績・目標達成状況を見る
  </a>

</div>

<!-- パスワード変更モーダル -->
<div id="pwModal" class="modal-bg">
  <div class="modal-box">
    <h2>パスワード変更</h2>
    <label>現在のパスワード</label>
    <input type="password" id="pwCurrent" />
    <label>新しいパスワード（4文字以上）</label>
    <input type="password" id="pwNew" />
    <div id="pwMsg" style="font-size:12px;min-height:16px;margin-bottom:8px;"></div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closePwModal()">キャンセル</button>
      <button class="modal-ok" onclick="changePassword()">変更する</button>
    </div>
  </div>
</div>

<script>
  let loggedInStaff = null;
  let PATIENT_ACTIONS = new Set();
  let ITEM_NAME_ACTIONS = new Set();
  let COUNT_ACTIONS = new Set();
  let TYPE_ACTIONS = {};
  let FREE_TEXT_ACTIONS = new Set();

  async function initAuth() {
    try {
      const res = await fetch('/api/me');
      const data = await res.json();
      if (!data.staffName) { location.href = '/staff-login'; return; }
      loggedInStaff = data.staffName;
    } catch { location.href = '/staff-login'; return; }

    const hu = document.getElementById('headerUser');
    const nameSpan = document.createElement('span');
    nameSpan.style.cssText = 'color:#2aab96;font-size:13px;font-weight:700';
    nameSpan.textContent = loggedInStaff;
    const pwBtn = document.createElement('button');
    pwBtn.className = 'hdr-btn';
    pwBtn.textContent = 'パスワード変更';
    pwBtn.onclick = function(){ document.getElementById('pwModal').style.display = 'flex'; };
    const logoutLink = document.createElement('a');
    logoutLink.href = '/staff-logout';
    logoutLink.className = 'hdr-btn';
    logoutLink.textContent = 'ログアウト';
    hu.appendChild(nameSpan); hu.appendChild(pwBtn); hu.appendChild(logoutLink);

    document.getElementById('staffNameInput').value = loggedInStaff;

    try {
      const [settingsRes, itemsRes] = await Promise.all([fetch('/api/staff-settings'), fetch('/api/action-items')]);
      const settings = await settingsRes.json();
      const allItems = await itemsRes.json();
      const s = settings.find(x => x.staffName === loggedInStaff);
      // 評価者はすぐ評価画面へ
      if (s && s.isEvaluator) { location.href = '/peer-eval'; return; }
      const disabled = (s && s.disabledItems) || [];
      const visibleItems = allItems.filter(item => !disabled.includes(item.name) && item.id !== 'i18');
      PATIENT_ACTIONS = new Set(visibleItems.filter(i => i.needsPatient).map(i => i.name));
      ITEM_NAME_ACTIONS = new Set(visibleItems.filter(i => i.showItemName).map(i => i.name));
      COUNT_ACTIONS = new Set(visibleItems.filter(i => i.needsCount).map(i => i.name));
      visibleItems.filter(i => i.typeOptions && i.typeOptions.length).forEach(i => { TYPE_ACTIONS[i.name] = i.typeOptions; });
      FREE_TEXT_ACTIONS = new Set(visibleItems.filter(i => i.needsFreeText).map(i => i.name));
      const sel = document.getElementById('actionSelect');
      const groups = {};
      const groupOrder = [];
      visibleItems.forEach(item => {
        if (!groups[item.group]) { groups[item.group] = []; groupOrder.push(item.group); }
        groups[item.group].push(item);
      });
      const FIXED_GROUP_ORDER = ['処置', '物品', 'アポ管理', 'チームサポート', 'ファン獲得', 'カウンセリング', '口コミ', '行動', 'その他'];
      const sortedGroups = [
        ...FIXED_GROUP_ORDER.filter(g => groups[g]),
        ...groupOrder.filter(g => !FIXED_GROUP_ORDER.includes(g))
      ];
      sortedGroups.forEach(grp => {
        const og = document.createElement('optgroup');
        og.label = '── ' + grp + ' ──';
        groups[grp].forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.name;
          opt.textContent = item.name;
          og.appendChild(opt);
        });
        sel.appendChild(og);
      });
    } catch(e) { console.error(e); }
  }

  // 日付セット＆時間制限（日本時間 13:30〜14:25 / 18:45〜翌9:00のみ入力可）
  const now = new Date();
  const jstMs = now.getTime() + 9 * 60 * 60 * 1000;
  const jst = new Date(jstMs);
  const jstH = jst.getUTCHours(), jstMin = jst.getUTCMinutes();
  const totalMin = jstH * 60 + jstMin;
  const isOpen = (totalMin >= 13 * 60 + 30 && totalMin <= 14 * 60 + 25)
              || totalMin >= 18 * 60 + 45
              || totalMin <= 9 * 60;
  if (!isOpen) {
    document.querySelector('.card').style.display = 'none';
    const lockDiv = document.createElement('div');
    lockDiv.style.cssText = 'text-align:center;padding:48px 24px;color:#e2e8f0';
    lockDiv.innerHTML = '<div style="font-size:48px;margin-bottom:16px">🔒</div>' +
      '<div style="font-size:18px;font-weight:700;margin-bottom:8px">入力時間外です</div>' +
      '<div style="font-size:14px;color:rgba(255,255,255,.5)">入力可能時間：13:30〜14:25 / 18:45〜翌9:00</div>';
    document.querySelector('.container') ? document.querySelector('.container').prepend(lockDiv) : document.body.prepend(lockDiv);
  }
  // 0:00〜9:00 は前日扱い
  if (jstH < 9 || (jstH === 9 && jstMin === 0)) jst.setUTCDate(jst.getUTCDate() - 1);
  const y = jst.getUTCFullYear(), mo = jst.getUTCMonth() + 1, d = jst.getUTCDate();
  const today = y + '-' + String(mo).padStart(2,'0') + '-' + String(d).padStart(2,'0');
  const weekdays = ['日','月','火','水','木','金','土'];
  const wd = weekdays[jst.getUTCDay()];
  const todayDisplay = y + '年' + mo + '月' + d + '日（' + wd + '）';
  document.getElementById('dateInput').value = today;
  const dateLabel = document.getElementById('dateInput').closest('.form-group').querySelector('label');
  if (dateLabel) dateLabel.textContent = '日付　今日：' + todayDisplay;

  function onActionChange() {
    const val = document.getElementById('actionSelect').value;
    const needsPatient = PATIENT_ACTIONS.has(val);
    const needsCount = COUNT_ACTIONS.has(val);
    const typeOpts = TYPE_ACTIONS[val];
    const needsFreeText = FREE_TEXT_ACTIONS.has(val);

    document.getElementById('patientNoWrap').classList.toggle('hidden', !needsPatient);
    document.getElementById('itemNameWrap').classList.toggle('hidden', !ITEM_NAME_ACTIONS.has(val));
    document.getElementById('countWrap').classList.toggle('hidden', !needsCount);
    document.getElementById('countLabel').textContent = (val === 'シーラント' ? '本数' : '件数');
    document.getElementById('typeWrap').classList.toggle('hidden', !typeOpts);
    document.getElementById('freeTextWrap').classList.toggle('hidden', !needsFreeText);

    if (ITEM_NAME_ACTIONS.has(val)) {
      document.getElementById('itemNameLabel').textContent = val.includes('すすめ') ? 'すすめた商品名' : '販売した商品名';
    }
    if (typeOpts) {
      const sel = document.getElementById('typeSelect');
      sel.innerHTML = '<option value="">選択してください</option>';
      typeOpts.forEach(function(o) { var opt = document.createElement('option'); opt.value = o; opt.textContent = o; sel.appendChild(opt); });
    }
    document.getElementById('typeSelect').required = !!typeOpts;
    document.getElementById('freeTextInput').required = needsFreeText;
    document.getElementById('countValue').required = needsCount;

    if (!needsPatient) { document.getElementById('patientNo').value = ''; document.getElementById('patientCheck').textContent = ''; }
    document.getElementById('patientNo').required = needsPatient;
    if (!needsCount) document.getElementById('countValue').value = '';
    if (!typeOpts && !needsFreeText) document.getElementById('freeTextInput') && (document.getElementById('freeTextInput').value = '');
  }

  let checkTimer;
  document.getElementById('patientNo').addEventListener('input', function() {
    clearTimeout(checkTimer);
    const val = this.value.trim();
    if (!val) { document.getElementById('patientCheck').textContent = ''; return; }
    checkTimer = setTimeout(async () => {
      try { await fetch('/api/check-patient/' + encodeURIComponent(val)); } catch {}
    }, 500);
  });

  document.getElementById('mainForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = '登録中...';
    const fd = new FormData(this);
    const data = {};
    for (const [k, v] of fd.entries()) data[k] = v;
    data.staffName = loggedInStaff;
    data.entryType = 'patient';
    const actionName = data.action;
    try {
      const res = await fetch('/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      if (res.status === 409) { const err = await res.json(); alert(err.message); btn.disabled = false; btn.textContent = '登録する'; return; }
      if (res.ok) {
        document.getElementById('mainForm').style.display = 'none';
        document.getElementById('successText').textContent = '「' + actionName + '」を記録しました。';
        document.getElementById('successMsg').style.display = 'block';
        window.scrollTo(0, 0);
      } else {
        let msg = '登録に失敗しました（' + res.status + '）';
        try { const e = await res.json(); if (e.error) msg += '：' + e.error; } catch {}
        alert(msg); btn.disabled = false; btn.textContent = '登録する';
      }
    } catch(err) { alert('通信エラー：' + err.message); btn.disabled = false; btn.textContent = '登録する'; }
  });

  function resetForm() {
    const f = document.getElementById('mainForm');
    f.reset();
    document.getElementById('dateInput').value = today;
    document.getElementById('staffNameInput').value = loggedInStaff;
    document.getElementById('patientNoWrap').classList.add('hidden');
    document.getElementById('itemNameWrap').classList.add('hidden');
    document.getElementById('countWrap').classList.add('hidden');
    document.getElementById('typeWrap').classList.add('hidden');
    document.getElementById('freeTextWrap').classList.add('hidden');
    document.getElementById('patientCheck').textContent = '';
    f.style.display = '';
    document.getElementById('successMsg').style.display = 'none';
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').textContent = '登録する';
    window.scrollTo(0, 0);
  }

  function closePwModal() {
    document.getElementById('pwModal').style.display = 'none';
    document.getElementById('pwCurrent').value = '';
    document.getElementById('pwNew').value = '';
    document.getElementById('pwMsg').textContent = '';
  }
  async function changePassword() {
    const currentPassword = document.getElementById('pwCurrent').value;
    const newPassword = document.getElementById('pwNew').value;
    const msg = document.getElementById('pwMsg');
    if (!currentPassword || !newPassword) { msg.style.color='#ef4444'; msg.textContent='両方入力してください'; return; }
    const res = await fetch('/staff-change-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ currentPassword, newPassword }) });
    const data = await res.json();
    if (res.ok) { msg.style.color='#34d399'; msg.textContent='変更しました'; setTimeout(closePwModal, 1200); }
    else { msg.style.color='#ef4444'; msg.textContent = data.error || '変更に失敗しました'; }
  }

  initAuth();
</script>
</body>
</html>
