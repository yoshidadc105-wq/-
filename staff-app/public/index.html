<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自己申告デラックス | のびのび歯科</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans JP', sans-serif; background: #f0f4f8; color: #1e293b; font-size: 15px; line-height: 1.6; }

    header { background: linear-gradient(135deg, #0f766e 0%, #2aab96 60%, #34d399 100%); padding: 0; box-shadow: 0 2px 12px rgba(15,118,110,.35); }
    .header-inner { max-width: 560px; margin: 0 auto; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-icon { width: 42px; height: 42px; background: rgba(255,255,255,.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    header h1 { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: .03em; }
    header p { font-size: 11px; color: rgba(255,255,255,.8); margin-top: 2px; }

    .container { max-width: 560px; margin: 0 auto; padding: 20px 16px 70px; }

    .card { background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04); padding: 20px; margin-bottom: 14px; }
    .card-title { font-size: 12px; font-weight: 700; color: #0f766e; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
    .card-title::before { content: ''; display: block; width: 3px; height: 14px; background: linear-gradient(180deg, #2aab96, #34d399); border-radius: 2px; }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 5px; }
    .required::after { content: "必須"; font-size: 10px; color: #fff; background: linear-gradient(135deg,#ef4444,#f87171); border-radius: 3px; padding: 1px 5px; margin-left: 6px; font-weight: 600; }
    input[type="text"], select, textarea {
      width: 100%; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 10px 14px;
      font-size: 15px; font-family: inherit; outline: none; transition: border .2s, box-shadow .2s; background: #f8fafc; color: #1e293b;
    }
    input:focus, select:focus, textarea:focus { border-color: #2aab96; background: #fff; box-shadow: 0 0 0 3px rgba(42,171,150,.12); }
    textarea { resize: vertical; min-height: 80px; }
    .patient-check { font-size: 12px; margin-top: 4px; min-height: 18px; }
    .hidden { display: none; }

    .submit-btn { display: block; width: 100%; background: linear-gradient(135deg, #0f766e, #2aab96); color: #fff; border: none; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; transition: opacity .2s, transform .1s; box-shadow: 0 4px 14px rgba(42,171,150,.4); letter-spacing: .05em; }
    .submit-btn:hover { opacity: .9; }
    .submit-btn:active { transform: scale(.98); }
    .submit-btn:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }

    .success-msg { display: none; text-align: center; padding: 40px 20px; }
    .success-icon { width: 72px; height: 72px; background: linear-gradient(135deg, #0f766e, #34d399); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 34px; margin: 0 auto 16px; box-shadow: 0 8px 24px rgba(42,171,150,.35); }
    .success-msg h2 { font-size: 20px; color: #0f766e; font-weight: 700; margin-bottom: 6px; }
    .success-msg p { color: #64748b; font-size: 14px; }
    .again-btn { display: inline-block; margin-top: 20px; background: linear-gradient(135deg, #0f766e, #2aab96); color: #fff; border: none; border-radius: 30px; padding: 11px 32px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 4px 12px rgba(42,171,150,.35); }

    .phrase-chip { background: #f0fdf4; border: 1px solid #a7f3d0; color: #065f46; border-radius: 20px; padding: 4px 11px; font-size: 12px; display: inline-block; cursor: pointer; transition: background .15s; }
    .phrase-chip:hover { background: #dcfce7; }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="header-left">
      <div class="header-icon">🦷</div>
      <div>
        <h1>自己申告デラックス</h1>
        <p>のびのび歯科・矯正歯科</p>
      </div>
    </div>
    <div id="headerUser" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;"></div>
  </div>
</header>

<div class="container">

  <div id="successMsg" class="success-msg card">
    <div class="success-icon">✓</div>
    <h2>登録しました</h2>
    <p id="successText"></p>
    <button class="again-btn" onclick="resetForm()">続けて入力する</button>
  </div>

  <form id="mainForm">
    <div class="card">
      <div class="card-title">基本情報</div>
      <div class="form-group">
        <label class="required">日付</label>
        <input type="text" id="dateInput" name="date" required readonly style="background:#f1f5f9;cursor:default;color:#475569;" />
      </div>
      <div class="form-group">
        <label class="required">スタッフ名</label>
        <input type="text" id="staffNameInput" name="staffName" readonly style="background:#f1f5f9;cursor:default;color:#0f766e;font-weight:700;" />
      </div>
    </div>

    <div class="card">
      <div class="card-title">実施内容</div>
      <div class="form-group">
        <label class="required">内容を選択</label>
        <select name="action" id="actionSelect" required onchange="onActionChange()">
          <option value="">選択してください</option>
          <optgroup label="── 物品 ──">
            <option value="物品販売">物品販売（購入）</option>
            <option value="物品をすすめた">物品をすすめた（未購入）</option>
          </optgroup>
          <optgroup label="── カウンセリング ──">
            <option value="ジャブ打ち">ジャブ打ち（アプローチ）</option>
            <option value="インプラント">インプラント成約</option>
            <option value="マウスピース矯正">マウスピース矯正成約</option>
            <option value="ホワイトニング">ホワイトニング成約</option>
          </optgroup>
          <optgroup label="── アポ管理 ──">
            <option value="アポ転換">土曜・平日夕方患者を平日午前/日中にアポ転換</option>
          </optgroup>
          <optgroup label="── 口コミ ──" id="kuchikomiGroup" style="display:none">
            <option value="口コミ獲得">口コミ獲得</option>
          </optgroup>
          <optgroup label="── 処置 ──">
            <option value="シーラント">シーラント</option>
            <option value="レントゲン">レントゲン</option>
            <option value="フッ素塗布">フッ素塗布</option>
          </optgroup>
          <optgroup label="── チームサポート ──">
            <option value="ポジティブ声掛け">他のスタッフにポジティブな声掛けをした</option>
          </optgroup>
          <optgroup label="── その他 ──">
            <option value="その他">その他（自由記述）</option>
          </optgroup>
        </select>
      </div>

      <!-- 患者番号（患者関連のみ表示） -->
      <div class="form-group hidden" id="patientNoWrap">
        <label class="required">患者番号</label>
        <input type="text" name="patientNo" id="patientNo" placeholder="例：1234" autocomplete="off" maxlength="10" />
        <div class="patient-check" id="patientCheck"></div>
      </div>

      <!-- 商品名（物品販売のみ） -->
      <div class="form-group hidden" id="itemNameWrap">
        <label>販売した商品名</label>
        <input type="text" name="itemName" placeholder="例：電動歯ブラシ、ホワイトニングジェルなど" />
      </div>

      <!-- 自由記述（行動系・その他） -->
      <div class="form-group hidden" id="freeTextWrap">
        <label>内容を記入</label>
        <textarea name="freeText" id="freeText" placeholder="自由に記入してください"></textarea>
        <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;" id="phraseButtons"></div>
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">登録する</button>
  </form>

  <!-- 自分の実績リンク -->
  <div style="margin-top:20px">
    <a href="/my-stats" style="display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#0f766e,#2aab96);color:#fff;border-radius:12px;padding:13px;font-size:14px;font-weight:700;text-decoration:none;box-shadow:0 4px 12px rgba(42,171,150,.35)">
      📊 自分の実績・目標達成状況を見る
    </a>
  </div>

</div>

<!-- パスワード変更モーダル -->
<div id="pwModal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:2000;align-items:center;justify-content:center;backdrop-filter:blur(3px)">
  <div style="background:#fff;border-radius:16px;padding:28px;max-width:360px;width:94%;box-shadow:0 20px 60px rgba(0,0,0,.2)">
    <h2 style="font-size:17px;font-weight:700;color:#0f766e;margin-bottom:18px">パスワード変更</h2>
    <div style="margin-bottom:12px">
      <label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">現在のパスワード</label>
      <input type="password" id="pwCurrent" style="width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none;" />
    </div>
    <div style="margin-bottom:12px">
      <label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">新しいパスワード（4文字以上）</label>
      <input type="password" id="pwNew" style="width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none;" />
    </div>
    <div id="pwMsg" style="font-size:12px;min-height:16px;margin-bottom:10px;"></div>
    <div style="display:flex;gap:8px">
      <button onclick="closePwModal()" style="flex:1;padding:10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;font-family:inherit">キャンセル</button>
      <button onclick="changePassword()" style="flex:1;padding:10px;background:linear-gradient(135deg,#0f766e,#2aab96);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">変更する</button>
    </div>
  </div>
</div>

<script>
  let loggedInStaff = null;

  // 患者番号が必要なアクション
  const PATIENT_ACTIONS = new Set(['物品販売','物品をすすめた','ジャブ打ち','インプラント','マウスピース矯正','ホワイトニング','アポ転換','口コミ獲得','シーラント','レントゲン','フッ素塗布','その他']);
  // 自由記述が出るアクション
  const FREE_TEXT_ACTIONS = new Set(['ポジティブ声掛け','その他']);

  async function initAuth() {
    try {
      const res = await fetch('/api/me');
      const data = await res.json();
      if (!data.staffName) { location.href = '/staff-login'; return; }
      loggedInStaff = data.staffName;
    } catch { location.href = '/staff-login'; return; }

    document.getElementById('headerUser').innerHTML =
      '<span style="color:rgba(255,255,255,.9);font-size:13px;font-weight:600">' + loggedInStaff + '</span>' +
      '<button onclick="document.getElementById(\'pwModal\').style.display=\'flex\'" style="background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">🔑 パスワード変更</button>' +
      '<a href="/staff-logout" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;text-decoration:none">ログアウト</a>';

    document.getElementById('staffNameInput').value = loggedInStaff;

    // 口コミ設定を反映
    try {
      const settingsRes = await fetch('/api/staff-settings');
      const settings = await settingsRes.json();
      const s = settings.find(x => x.staffName === loggedInStaff);
      if (s && s.showKuchikomi) document.getElementById('kuchikomiGroup').style.display = '';
    } catch {}
  }

  // 日付セット
  const todayDate = new Date();
  const today = todayDate.toLocaleDateString('sv-SE');
  const todayDisplay = todayDate.toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
  document.getElementById('dateInput').value = today;
  document.querySelector('#mainForm .form-group:first-child label').textContent = '日付（今日：' + todayDisplay + '）';

  function onActionChange() {
    const val = document.getElementById('actionSelect').value;
    const needsPatient = PATIENT_ACTIONS.has(val);
    const needsFreeText = FREE_TEXT_ACTIONS.has(val);
    document.getElementById('patientNoWrap').classList.toggle('hidden', !needsPatient);
    document.getElementById('freeTextWrap').classList.toggle('hidden', !needsFreeText);
    document.getElementById('itemNameWrap').classList.toggle('hidden', val !== '物品販売');
    if (!needsPatient) { document.getElementById('patientNo').value = ''; document.getElementById('patientCheck').textContent = ''; }
    if (!needsFreeText) document.getElementById('freeText').value = '';
    // 患者番号の必須属性
    document.getElementById('patientNo').required = needsPatient;
  }

  // 患者番号チェック
  let checkTimer;
  document.getElementById('patientNo').addEventListener('input', function() {
    clearTimeout(checkTimer);
    const val = this.value.trim();
    if (!val) { document.getElementById('patientCheck').textContent = ''; return; }
    checkTimer = setTimeout(async () => {
      try { await fetch('/api/check-patient/' + encodeURIComponent(val)); } catch {}
    }, 500);
  });

  // フォーム送信
  document.getElementById('mainForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = '登録中...';
    const fd = new FormData(this);
    const data = {};
    for (const [k, v] of fd.entries()) data[k] = v;
    data.staffName = loggedInStaff;

    const val = data.action;
    if (FREE_TEXT_ACTIONS.has(val) && !PATIENT_ACTIONS.has(val)) {
      data.entryType = 'behavior';
    } else {
      data.entryType = 'patient';
    }

    try {
      const res = await fetch('/submit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
      });
      if (res.status === 409) {
        const err = await res.json();
        alert(err.message);
        btn.disabled = false; btn.textContent = '登録する';
        return;
      }
      if (res.ok) {
        document.getElementById('mainForm').style.display = 'none';
        document.getElementById('successText').textContent = '「' + val + '」を記録しました。';
        document.getElementById('successMsg').style.display = 'block';
        window.scrollTo(0, 0);
      } else throw new Error();
    } catch {
      alert('登録に失敗しました。');
      btn.disabled = false; btn.textContent = '登録する';
    }
  });

  function resetForm() {
    const f = document.getElementById('mainForm');
    f.reset();
    document.getElementById('dateInput').value = today;
    document.getElementById('staffNameInput').value = loggedInStaff;
    document.getElementById('patientNoWrap').classList.add('hidden');
    document.getElementById('freeTextWrap').classList.add('hidden');
    document.getElementById('itemNameWrap').classList.add('hidden');
    document.getElementById('patientCheck').textContent = '';
    f.style.display = '';
    document.getElementById('successMsg').style.display = 'none';
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').textContent = '登録する';
    window.scrollTo(0, 0);
  }

  // 記入例（クリックで入力）
  const PHRASES = [
    '受付で患者さんを名前で呼んで笑顔でお迎えした',
    '予防の重要性を患者さんにわかりやすく説明し定期検診につなげた',
    '患者さんからの質問に自信を持って分かりやすく答えた',
    '急な予約変更や問い合わせに冷静・丁寧に対応した',
    '在庫が少ない材料にいち早く気づき補充・報告した',
    '院内清掃をだれよりも丁寧に毎日欠かさず行った',
    '勉強会や研修の内容を自分なりにまとめチームに共有した',
    '遅刻なく毎日時間通りに出勤した',
  ];
  const phraseContainer = document.getElementById('phraseButtons');
  const exLabel = document.createElement('div');
  exLabel.style.cssText = 'font-size:12px;color:#9ca3af;margin-bottom:6px;width:100%;';
  exLabel.textContent = '▼ 記入例（タップで入力）';
  phraseContainer.appendChild(exLabel);
  PHRASES.forEach(p => {
    const chip = document.createElement('span');
    chip.textContent = p;
    chip.className = 'phrase-chip';
    chip.onclick = () => { document.getElementById('freeText').value = p; };
    phraseContainer.appendChild(chip);
  });

  function closePwModal() {
    document.getElementById('pwModal').style.display = 'none';
    document.getElementById('pwCurrent').value = '';
    document.getElementById('pwNew').value = '';
    document.getElementById('pwMsg').textContent = '';
  }
  async function changePassword() {
    const currentPassword = document.getElementById('pwCurrent').value;
    const newPassword = document.getElementById('pwNew').value;
    const msg = document.getElementById('pwMsg');
    if (!currentPassword || !newPassword) { msg.style.color='#dc2626'; msg.textContent='両方入力してください'; return; }
    const res = await fetch('/staff-change-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ currentPassword, newPassword })
    });
    const data = await res.json();
    if (res.ok) { msg.style.color='#059669'; msg.textContent='変更しました'; setTimeout(closePwModal, 1200); }
    else { msg.style.color='#dc2626'; msg.textContent = data.error || '変更に失敗しました'; }
  }

  initAuth();
</script>
</body>
</html>
