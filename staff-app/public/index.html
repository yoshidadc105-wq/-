<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スタッフ実績入力 | のびのび歯科</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Hiragino Kaku Gothic Pro", "Meiryo", sans-serif; background: #f4f7f9; color: #333; font-size: 15px; line-height: 1.6; }
    header { background: #2aab96; color: #fff; padding: 16px 20px; text-align: center; }
    header h1 { font-size: 18px; font-weight: bold; }
    header p { font-size: 12px; margin-top: 4px; opacity: .85; }
    .container { max-width: 560px; margin: 20px auto; padding: 0 16px 60px; }

    .tab-row { display: flex; gap: 0; margin-bottom: 16px; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .tab-btn { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; border: none; cursor: pointer; transition: background .2s, color .2s; background: #fff; color: #9ca3af; }
    .tab-btn.active { background: #2aab96; color: #fff; }

    .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 20px; margin-bottom: 16px; }
    .card-title { font-size: 14px; font-weight: bold; color: #fff; background: #2aab96; border-radius: 6px; padding: 5px 12px; margin-bottom: 14px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; font-weight: bold; }
    .required::after { content: "必須"; font-size: 11px; color: #fff; background: #e05; border-radius: 3px; padding: 1px 5px; margin-left: 6px; font-weight: normal; }
    input[type="text"], input[type="date"], select, textarea {
      width: 100%; border: 1px solid #ccc; border-radius: 6px; padding: 9px 12px;
      font-size: 15px; font-family: inherit; outline: none; transition: border .2s; background: #fff;
    }
    input:focus, select:focus, textarea:focus { border-color: #2aab96; }
    textarea { resize: vertical; min-height: 80px; }
    .row2 { display: flex; gap: 10px; }
    .row2 > * { flex: 1; }
    .patient-check { font-size: 12px; margin-top: 4px; min-height: 18px; }
    .check-ok { color: #059669; }
    .check-ng { color: #dc2626; font-weight: bold; }
    .item-detail { display: none; margin-top: 8px; }

    .submit-btn { display: block; width: 100%; background: #2aab96; color: #fff; border: none; border-radius: 30px; padding: 14px; font-size: 17px; font-weight: bold; cursor: pointer; transition: background .2s; }
    .submit-btn:hover { background: #228f7c; }
    .submit-btn:disabled { background: #aaa; cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 36px 20px; }
    .success-msg .icon { font-size: 56px; }
    .success-msg h2 { font-size: 20px; color: #2aab96; margin: 14px 0 8px; }
    .success-msg p { color: #666; font-size: 14px; }
    .success-msg .again-btn { display: inline-block; margin-top: 16px; background: #2aab96; color: #fff; border: none; border-radius: 20px; padding: 10px 28px; font-size: 15px; cursor: pointer; }

    .recent-title { font-size: 14px; font-weight: bold; color: #065f46; margin-bottom: 10px; border-left: 4px solid #2aab96; padding-left: 8px; }
    .record-item { background: #fff; border-radius: 8px; border: 1px solid #e5e7eb; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; }
    .record-item .staff-name { font-weight: bold; color: #2aab96; }
    .record-item .record-date { font-size: 11px; color: #9ca3af; float: right; }
    .record-item .record-body { margin-top: 4px; color: #555; }
    .badge { display: inline-block; border-radius: 4px; padding: 2px 8px; font-size: 12px; }
    .badge-item      { background: #fef3c7; color: #92400e; }
    .badge-counseling{ background: #dbeafe; color: #1e40af; }
    .badge-review    { background: #fce7f3; color: #9d174d; }
    .badge-treatment { background: #e8f7f5; color: #065f46; }
    .badge-behavior  { background: #f3e8ff; color: #6b21a8; }
    .loading { text-align: center; color: #9ca3af; padding: 20px; font-size: 13px; }

    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>
<header>
  <h1>スタッフ実績入力</h1>
  <p>のびのび歯科・矯正歯科</p>
</header>
<div class="container">

  <div class="tab-row">
    <button class="tab-btn active" onclick="switchTab('patient')">患者実績を入力</button>
    <button class="tab-btn" onclick="switchTab('behavior')">行動・取り組みを入力</button>
  </div>

  <!-- ===== 患者実績パネル ===== -->
  <div id="panel-patient" class="panel active">
    <div id="success-patient" class="success-msg card">
      <div class="icon">✅</div>
      <h2>登録しました</h2>
      <p>患者実績を記録しました。</p>
      <button class="again-btn" onclick="resetPatient()">続けて入力する</button>
    </div>
    <form id="form-patient">
      <input type="hidden" name="entryType" value="patient" />
      <div class="card">
        <div class="card-title">基本情報</div>
        <div class="row2">
          <div class="form-group">
            <label class="required">日付</label>
            <input type="date" name="date" id="pDate" required />
          </div>
          <div class="form-group">
            <label class="required">スタッフ名</label>
            <input type="text" name="staffName" placeholder="例：田中" required />
          </div>
        </div>
        <div class="form-group">
          <label class="required">患者番号</label>
          <input type="text" name="patientNo" id="patientNo" placeholder="例：1234" required autocomplete="off" maxlength="10" />
          <div class="patient-check" id="patientCheck"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">実施内容</div>
        <div class="form-group">
          <label class="required">内容を選択</label>
          <select name="action" id="actionSelect" required onchange="onActionChange()">
            <option value="">選択してください</option>
            <optgroup label="── 実績 ──">
              <option value="物品販売">物品販売</option>
              <option value="口コミ獲得">口コミ獲得</option>
            </optgroup>
            <optgroup label="── カウンセリング成約 ──">
              <option value="インプラント">インプラント</option>
              <option value="マウスピース矯正">マウスピース矯正</option>
              <option value="ホワイトニング">ホワイトニング</option>
            </optgroup>
            <optgroup label="── 処置 ──">
              <option value="シーラント">シーラント</option>
              <option value="レントゲン">レントゲン</option>
              <option value="フッ素塗布">フッ素塗布</option>
            </optgroup>
            <optgroup label="── その他 ──">
              <option value="その他">その他（自由記述）</option>
            </optgroup>
          </select>
        </div>
        <div class="item-detail" id="itemNameWrap">
          <label>販売した商品名</label>
          <input type="text" name="itemName" placeholder="例：電動歯ブラシ、ホワイトニングジェルなど" />
        </div>
        <div class="item-detail" id="otherWrap">
          <label>内容を記入</label>
          <input type="text" name="otherText" placeholder="自由に記入してください" />
        </div>
      </div>

      <button type="submit" class="submit-btn" id="pSubmitBtn">登録する</button>
    </form>
  </div>

  <!-- ===== 行動・取り組みパネル ===== -->
  <div id="panel-behavior" class="panel">
    <div id="success-behavior" class="success-msg card">
      <div class="icon">✅</div>
      <h2>登録しました</h2>
      <p>取り組みを記録しました。</p>
      <button class="again-btn" onclick="resetBehavior()">続けて入力する</button>
    </div>
    <form id="form-behavior">
      <input type="hidden" name="entryType" value="behavior" />
      <div class="card">
        <div class="card-title">基本情報</div>
        <div class="row2">
          <div class="form-group">
            <label class="required">日付</label>
            <input type="date" name="date" id="bDate" required />
          </div>
          <div class="form-group">
            <label class="required">スタッフ名</label>
            <input type="text" name="staffName" placeholder="例：田中" required />
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">行動・取り組みの記録</div>
        <div class="form-group">
          <label class="required">内容</label>
          <textarea name="freeText" id="freeText" placeholder="下のボタンから選ぶか、自由に入力してください" required></textarea>
          <div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;" id="phraseButtons"></div>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="bSubmitBtn">登録する</button>
    </form>
  </div>

  <!-- 最近の入力一覧 -->
  <div style="margin-top:28px">
    <div class="recent-title">みんなの最近の入力（直近50件）</div>
    <div id="recentList"><div class="loading">読み込み中...</div></div>
  </div>

</div>

<script>
  // タブ切替
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0) === (tab === 'patient'));
    });
    document.getElementById('panel-patient').classList.toggle('active', tab === 'patient');
    document.getElementById('panel-behavior').classList.toggle('active', tab === 'behavior');
  }

  // 例文ボタン
  const PHRASES = [
    'だれよりもトイレ掃除を丁寧に行った',
    '患者さんに笑顔で対応できた',
    '毎日マニュアルを確認している',
    '院内の整理整頓を率先して行った',
    '患者さんのお名前を覚えて声かけした',
    'チームへの報連相を徹底した',
    '新人スタッフのサポートをした',
    '器具の準備・片付けを迅速に行った',
    '患者さんへの治療説明をわかりやすく行った',
    '時間に正確で遅刻ゼロだった',
    '自主的に勉強・スキルアップに取り組んだ',
    'クレームゼロで患者満足度を高めた',
    'チームの雰囲気づくりに貢献した',
  ];
  const phraseButtons = document.getElementById('phraseButtons');
  PHRASES.forEach(p => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = p;
    btn.style.cssText = 'background:#f3e8ff;border:1px solid #a855f7;color:#6b21a8;border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer;';
    btn.onclick = () => { document.getElementById('freeText').value = p; };
    phraseButtons.appendChild(btn);
  });

  // 日付初期値
  const today = new Date().toLocaleDateString('sv-SE');
  document.getElementById('pDate').value = today;
  document.getElementById('bDate').value = today;

  // 実施内容変更時
  function onActionChange() {
    const val = document.getElementById('actionSelect').value;
    document.getElementById('itemNameWrap').style.display = val === '物品販売' ? 'block' : 'none';
    document.getElementById('otherWrap').style.display   = val === 'その他'    ? 'block' : 'none';
  }

  // 患者番号重複チェック
  let checkTimer;
  document.getElementById('patientNo').addEventListener('input', function() {
    clearTimeout(checkTimer);
    const val = this.value.trim();
    const el = document.getElementById('patientCheck');
    if (!val) { el.textContent = ''; return; }
    el.textContent = '確認中...';
    el.className = 'patient-check';
    checkTimer = setTimeout(async () => {
      try {
        const res = await fetch('/api/check-patient/' + encodeURIComponent(val));
        const data = await res.json();
        if (data.exists) {
          el.textContent = '⚠ この患者番号はすでに登録されています';
          el.className = 'patient-check check-ng';
        } else {
          el.textContent = '✓ 未登録です（入力可）';
          el.className = 'patient-check check-ok';
        }
      } catch { el.textContent = ''; }
    }, 500);
  });

  // 患者実績フォーム送信
  document.getElementById('form-patient').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('pSubmitBtn');
    btn.disabled = true; btn.textContent = '登録中...';
    const fd = new FormData(this);
    const data = {};
    for (const [k, v] of fd.entries()) data[k] = v;
    try {
      const res = await fetch('/submit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
      });
      if (res.status === 409) {
        const err = await res.json();
        alert(err.message);
        btn.disabled = false; btn.textContent = '登録する';
        return;
      }
      if (res.ok) {
        this.style.display = 'none';
        document.getElementById('success-patient').style.display = 'block';
        window.scrollTo(0, 0);
        loadRecent();
      } else throw new Error();
    } catch {
      alert('登録に失敗しました。');
      btn.disabled = false; btn.textContent = '登録する';
    }
  });

  function resetPatient() {
    const f = document.getElementById('form-patient');
    f.reset();
    document.getElementById('pDate').value = today;
    document.getElementById('patientCheck').textContent = '';
    document.getElementById('itemNameWrap').style.display = 'none';
    document.getElementById('otherWrap').style.display = 'none';
    f.style.display = '';
    document.getElementById('success-patient').style.display = 'none';
    document.getElementById('pSubmitBtn').disabled = false;
    document.getElementById('pSubmitBtn').textContent = '登録する';
    window.scrollTo(0, 0);
  }

  // 行動フォーム送信
  document.getElementById('form-behavior').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('bSubmitBtn');
    btn.disabled = true; btn.textContent = '登録中...';
    const fd = new FormData(this);
    const data = {};
    for (const [k, v] of fd.entries()) data[k] = v;
    try {
      const res = await fetch('/submit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
      });
      if (res.ok) {
        this.style.display = 'none';
        document.getElementById('success-behavior').style.display = 'block';
        window.scrollTo(0, 0);
        loadRecent();
      } else throw new Error();
    } catch {
      alert('登録に失敗しました。');
      btn.disabled = false; btn.textContent = '登録する';
    }
  });

  function resetBehavior() {
    const f = document.getElementById('form-behavior');
    f.reset();
    document.getElementById('bDate').value = today;
    f.style.display = '';
    document.getElementById('success-behavior').style.display = 'none';
    document.getElementById('bSubmitBtn').disabled = false;
    document.getElementById('bSubmitBtn').textContent = '登録する';
    window.scrollTo(0, 0);
  }

  // 最近の入力一覧
  async function loadRecent() {
    const list = document.getElementById('recentList');
    try {
      const res = await fetch('/api/records');
      const records = await res.json();
      if (!records.length) { list.innerHTML = '<div class="loading">まだ入力がありません</div>'; return; }
      list.innerHTML = records.map(r => {
        let badgeHtml = '';
        let body = '';
        if (r.entryType === 'behavior') {
          badgeHtml = `<span class="badge badge-behavior">行動記録</span>`;
          body = r.freeText ? `「${r.freeText}」` : '';
        } else {
          const actionType = r.actionCategory || 'treatment';
          const colorMap = { item: 'badge-item', counseling: 'badge-counseling', review: 'badge-review', treatment: 'badge-treatment' };
          badgeHtml = `<span class="badge ${colorMap[actionType] || 'badge-treatment'}">${r.action}</span>`;
          if (r.itemName) body += ` ${r.itemName}`;
          if (r.otherText) body += ` ${r.otherText}`;
          body = body.trim();
        }
        return `<div class="record-item">
          <span class="record-date">${r.date}</span>
          <span class="staff-name">${r.staffName}</span>${r.patientNo ? `<span style="color:#9ca3af;font-size:12px"> 患者:${r.patientNo}</span>` : ''}
          <div class="record-body">${badgeHtml}${body ? ` <span style="font-size:12px">${body}</span>` : ''}</div>
        </div>`;
      }).join('');
    } catch { list.innerHTML = '<div class="loading">読み込みに失敗しました</div>'; }
  }

  loadRecent();
</script>
</body>
</html>
