<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>のびのび歯科 クイズ管理</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; background: #f1f0ff; color: #1e1b4b; min-height: 100vh; }

  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { background: #fff; border-radius: 16px; padding: 48px 40px; box-shadow: 0 8px 32px rgba(79,70,229,0.12); width: 100%; max-width: 400px; text-align: center; }
  .login-card .logo { font-size: 2rem; font-weight: 800; color: #4f46e5; margin-bottom: 4px; }
  .login-card .subtitle { color: #6b7280; font-size: 0.9rem; margin-bottom: 32px; }
  .login-card input { width: 100%; padding: 12px 16px; border: 2px solid #e0e7ff; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color .2s; margin-bottom: 16px; }
  .login-card input:focus { border-color: #4f46e5; }
  .login-card button { width: 100%; padding: 12px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s; }
  .login-card button:hover { background: #4338ca; }
  .login-error { color: #dc2626; font-size: 0.85rem; margin-top: 8px; }

  #app { display: none; flex-direction: column; min-height: 100vh; }
  header { background: #4f46e5; color: #fff; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 60px; box-shadow: 0 2px 8px rgba(79,70,229,0.3); }
  header .title { font-size: 1.2rem; font-weight: 800; letter-spacing: 0.02em; }
  header button { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: background .2s; }
  header button:hover { background: rgba(255,255,255,0.25); }

  .tabs { background: #fff; display: flex; border-bottom: 2px solid #e0e7ff; padding: 0 24px; overflow-x: auto; }
  .tab-btn { padding: 14px 18px; border: none; background: none; cursor: pointer; font-size: 0.9rem; color: #6b7280; font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: color .2s, border-color .2s; white-space: nowrap; font-family: inherit; }
  .tab-btn.active { color: #4f46e5; border-bottom-color: #4f46e5; }
  .tab-btn:hover:not(.active) { color: #4f46e5; }

  .tab-content { display: none; padding: 24px; flex: 1; }
  .tab-content.active { display: block; }

  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(79,70,229,0.07); margin-bottom: 16px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .card-header h2 { font-size: 1.1rem; font-weight: 700; color: #312e81; }

  .set-list { display: grid; gap: 12px; }
  .set-item { background: #fff; border: 2px solid #e0e7ff; border-radius: 10px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; transition: border-color .2s; }
  .set-item.inactive { opacity: 0.6; background: #f9f9f9; }
  .set-item:hover { border-color: #a5b4fc; }
  .set-item-info h3 { font-size: 1rem; font-weight: 700; color: #1e1b4b; }
  .set-item-info p { font-size: 0.82rem; color: #6b7280; margin-top: 2px; }
  .set-item-actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .btn { padding: 7px 14px; border: none; border-radius: 7px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: opacity .15s, transform .1s; font-family: inherit; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-primary:hover { background: #4338ca; }
  .btn-secondary { background: #e0e7ff; color: #4f46e5; }
  .btn-secondary:hover { background: #c7d2fe; }
  .btn-danger { background: #fee2e2; color: #dc2626; }
  .btn-danger:hover { background: #fecaca; }
  .btn-success { background: #16a34a; color: #fff; }
  .btn-success:hover { background: #15803d; }
  .btn-warning { background: #fef3c7; color: #92400e; }
  .btn-warning:hover { background: #fde68a; }
  .btn-lg { padding: 11px 24px; font-size: 1rem; }

  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 0.88rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 10px 14px; border: 2px solid #e0e7ff; border-radius: 8px; font-size: 0.95rem;
    font-family: inherit; outline: none; transition: border-color .2s; background: #fff;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #4f46e5; }
  .form-group textarea { resize: vertical; min-height: 160px; }

  .spinner-wrap { display: flex; align-items: center; justify-content: center; padding: 40px; gap: 12px; color: #4f46e5; font-weight: 600; }
  .spinner { width: 36px; height: 36px; border: 4px solid #e0e7ff; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .question-editor { background: #f8f7ff; border: 2px solid #e0e7ff; border-radius: 10px; padding: 16px; margin-bottom: 14px; position: relative; }
  .question-editor .q-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .question-editor .q-num { font-size: 0.78rem; font-weight: 700; color: #4f46e5; background: #e0e7ff; padding: 2px 8px; border-radius: 20px; }
  .question-editor .q-fields { display: grid; gap: 10px; }
  .q-fields label { font-size: 0.8rem; font-weight: 600; color: #374151; margin-bottom: 2px; display: block; }
  .q-fields input, .q-fields textarea, .q-fields select {
    width: 100%; padding: 8px 10px; border: 1.5px solid #c7d2fe; border-radius: 6px; font-size: 0.88rem; font-family: inherit; outline: none; background: #fff;
  }
  .q-fields input:focus, .q-fields textarea:focus, .q-fields select:focus { border-color: #4f46e5; }
  .options-list { display: grid; gap: 6px; }
  .option-row { display: flex; gap: 6px; align-items: center; }
  .option-row input { flex: 1; }
  .option-row button { flex-shrink: 0; padding: 6px 10px; }
  .add-option-btn { margin-top: 6px; font-size: 0.8rem; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th { background: #4f46e5; color: #fff; padding: 10px 14px; text-align: left; font-weight: 600; }
  td { padding: 10px 14px; border-bottom: 1px solid #e0e7ff; vertical-align: top; }
  tr:hover td { background: #f8f7ff; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
  .badge-green { background: #dcfce7; color: #16a34a; }
  .badge-yellow { background: #fef9c3; color: #ca8a04; }
  .badge-red { background: #fee2e2; color: #dc2626; }

  /* Submission detail */
  .sub-detail-toggle { background: #e0e7ff; border: none; border-radius: 6px; padding: 3px 10px; font-size: 0.78rem; cursor: pointer; color: #4f46e5; font-weight: 600; white-space: nowrap; font-family: inherit; }
  .sub-detail-body { display: none; margin-top: 8px; }
  .sub-detail-body.open { display: block; }
  .sub-detail-item { font-size: 0.82rem; padding: 4px 0; border-bottom: 1px dashed #e0e7ff; line-height: 1.5; }
  .sub-detail-item:last-child { border: none; }
  .sub-detail-correct { color: #16a34a; }
  .sub-detail-wrong { color: #dc2626; }

  /* Staff tab */
  .staff-group { background: #fff; border: 2px solid #e0e7ff; border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .staff-group-header { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: background .15s; }
  .staff-group-header:hover { background: #f8f7ff; }
  .staff-name-label { font-size: 1rem; font-weight: 700; color: #1e1b4b; }
  .staff-stats { font-size: 0.82rem; color: #6b7280; margin-top: 2px; }
  .staff-toggle-icon { color: #4f46e5; font-size: 0.9rem; font-weight: 700; }
  .staff-history { display: none; border-top: 1px solid #e0e7ff; }
  .staff-history.open { display: block; }
  .staff-history-item { padding: 10px 18px; border-bottom: 1px solid #f0f0ff; }
  .staff-history-item:last-child { border: none; }
  .staff-history-item .h-meta { font-size: 0.8rem; color: #6b7280; margin-bottom: 4px; }
  .staff-history-item .h-score { font-size: 0.9rem; font-weight: 700; }
  .staff-history-item .h-details { margin-top: 6px; display: none; }
  .staff-history-item .h-details.open { display: block; }
  .h-q-item { font-size: 0.8rem; padding: 3px 0; border-bottom: 1px dashed #e0e7ff; line-height: 1.5; }
  .h-q-item:last-child { border: none; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.hidden { display: none; }
  .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal-header { padding: 20px 24px 0; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: #fff; z-index: 1; padding-bottom: 16px; border-bottom: 1px solid #e0e7ff; }
  .modal-header h2 { font-size: 1.1rem; font-weight: 700; color: #1e1b4b; }
  .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #6b7280; line-height: 1; padding: 4px; }
  .modal-body { padding: 20px 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid #e0e7ff; display: flex; justify-content: flex-end; gap: 10px; }

  .empty-state { text-align: center; padding: 48px 24px; color: #9ca3af; }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: 0.95rem; }
  .alert { padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 16px; }
  .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  .type-label { font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; display: inline-block; margin-left: 8px; }
  .type-truefalse { background: #dbeafe; color: #1d4ed8; }
  .type-choice { background: #fce7f3; color: #9d174d; }
  .type-fill { background: #d1fae5; color: #065f46; }
  .type-sort { background: #fef3c7; color: #92400e; }

  @media (max-width: 600px) {
    .tab-content { padding: 12px; }
    .set-item { flex-direction: column; align-items: flex-start; gap: 10px; }
    .modal { max-height: 95vh; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="logo">🦷 のびのび歯科</div>
    <div class="subtitle">クイズ管理システム</div>
    <input type="password" id="password-input" placeholder="管理者パスワード" autocomplete="current-password">
    <button onclick="doLogin()">ログイン</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="title">🦷 のびのび歯科 クイズ管理</div>
    <button onclick="doLogout()">ログアウト</button>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('sets')">📋 クイズ一覧</button>
    <button class="tab-btn" onclick="switchTab('generate')">✨ AI生成</button>
    <button class="tab-btn" onclick="switchTab('submissions')">📊 回答記録</button>
    <button class="tab-btn" onclick="switchTab('staff')">👤 回答者</button>
  </div>

  <!-- Tab: Quiz Sets -->
  <div id="tab-sets" class="tab-content active">
    <div class="card">
      <div class="card-header">
        <h2>クイズセット一覧</h2>
        <button class="btn btn-secondary" onclick="loadSets()">🔄 更新</button>
      </div>
      <div id="sets-list"><div class="spinner-wrap"><div class="spinner"></div> 読み込み中…</div></div>
    </div>
  </div>

  <!-- Tab: AI Generation -->
  <div id="tab-generate" class="tab-content">
    <div class="card">
      <div class="card-header"><h2>AIでクイズを生成する</h2></div>
      <div class="form-group">
        <label>マニュアルシステムから選ぶ</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <select id="manual-select" style="flex:1;" onchange="onManualSelect()">
            <option value="">— マニュアルを選択してください —</option>
          </select>
          <button class="btn btn-secondary" onclick="loadManualList()" id="manual-load-btn">📂 一覧を読み込む</button>
        </div>
        <div id="manual-load-status" style="font-size:0.82rem;margin-top:6px;color:#6b7280;"></div>
      </div>
      <div style="text-align:center;color:#9ca3af;font-size:0.85rem;margin:-4px 0 12px;">— または手動で入力 —</div>
      <div class="form-group">
        <label for="manual-name">マニュアル名</label>
        <input type="text" id="manual-name" placeholder="例: 感染管理マニュアル 2024年版">
      </div>
      <div class="form-group">
        <label for="manual-text">マニュアルテキスト</label>
        <textarea id="manual-text" placeholder="クイズの元となるテキストを貼り付けてください…"></textarea>
      </div>
      <div class="form-group">
        <label for="q-count">問題数</label>
        <select id="q-count">
          <option value="1">1問</option>
          <option value="2">2問</option>
          <option value="3">3問</option>
          <option value="4">4問</option>
          <option value="5" selected>5問</option>
          <option value="6">6問</option>
          <option value="7">7問</option>
          <option value="8">8問</option>
          <option value="9">9問</option>
          <option value="10">10問</option>
        </select>
      </div>
      <button class="btn btn-primary btn-lg" onclick="generateQuestions()">✨ AIで生成する</button>
    </div>
    <div id="generate-status"></div>
    <div id="generated-questions-wrap" style="display:none;">
      <div class="card-header" style="margin-top:8px;">
        <h2 style="font-size:1.1rem;font-weight:700;color:#312e81;">生成された問題</h2>
        <button class="btn btn-success btn-lg" onclick="saveGeneratedSet()">💾 保存する</button>
      </div>
      <div id="generated-questions"></div>
    </div>
  </div>

  <!-- Tab: Submissions -->
  <div id="tab-submissions" class="tab-content">
    <div class="card">
      <div class="card-header">
        <h2>回答記録</h2>
        <button class="btn btn-secondary" onclick="loadSubmissions()">🔄 更新</button>
      </div>
      <div id="submissions-list"><div class="spinner-wrap"><div class="spinner"></div> 読み込み中…</div></div>
    </div>
  </div>

  <!-- Tab: Staff -->
  <div id="tab-staff" class="tab-content">
    <div class="card">
      <div class="card-header">
        <h2>回答者別記録</h2>
        <button class="btn btn-secondary" onclick="loadStaffTab()">🔄 更新</button>
      </div>
      <div id="staff-list"><div class="spinner-wrap"><div class="spinner"></div> 読み込み中…</div></div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay hidden" id="edit-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>クイズセットを編集</h2>
      <button class="modal-close" onclick="closeEditModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>マニュアル名</label>
        <input type="text" id="edit-name">
      </div>
      <div id="edit-questions"></div>
      <button class="btn btn-secondary" onclick="addQuestionToEdit()" style="margin-top:8px;">＋ 問題を追加</button>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeEditModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveEdit()">保存する</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay hidden" id="delete-modal">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <h2>削除の確認</h2>
      <button class="modal-close" onclick="closeDeleteModal()">×</button>
    </div>
    <div class="modal-body">
      <p>このクイズセットを削除してもよいですか？この操作は取り消せません。</p>
      <p style="font-weight:700;margin-top:10px;" id="delete-set-name"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeDeleteModal()">キャンセル</button>
      <button class="btn btn-danger" onclick="confirmDelete()">削除する</button>
    </div>
  </div>
</div>

<script>
let authHeader = '';
let currentSets = [];
let generatedQuestions = [];
let editingSetId = null;
let deletingSetId = null;

// ========== Auth ==========
function doLogin() {
  const pw = document.getElementById('password-input').value;
  if (!pw) { document.getElementById('login-error').textContent = 'パスワードを入力してください'; return; }
  authHeader = 'Basic ' + btoa(':' + pw);
  fetch('/api/sets', { headers: { Authorization: authHeader } })
    .then(r => {
      if (r.ok) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        document.getElementById('app').style.flexDirection = 'column';
        loadSets();
      } else {
        document.getElementById('login-error').textContent = 'パスワードが違います';
        authHeader = '';
      }
    })
    .catch(() => { document.getElementById('login-error').textContent = '接続エラーが発生しました'; authHeader = ''; });
}

document.getElementById('password-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function doLogout() {
  authHeader = '';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('password-input').value = '';
  document.getElementById('login-error').textContent = '';
}

// ========== Tabs ==========
function switchTab(name) {
  const names = ['sets', 'generate', 'submissions', 'staff'];
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', names[i] === name));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'sets') loadSets();
  if (name === 'submissions') loadSubmissions();
  if (name === 'staff') loadStaffTab();
}

// ========== Sets Tab ==========
async function loadSets() {
  const el = document.getElementById('sets-list');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div> 読み込み中…</div>';
  try {
    const r = await fetch('/api/sets', { headers: { Authorization: authHeader } });
    if (!r.ok) throw new Error();
    currentSets = await r.json();
    renderSets();
  } catch {
    el.innerHTML = '<div class="alert alert-error">読み込みに失敗しました</div>';
  }
}

function renderSets() {
  const el = document.getElementById('sets-list');
  if (!currentSets.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>クイズセットがありません。「AI生成」タブから作成してください。</p></div>';
    return;
  }
  el.innerHTML = '<div class="set-list">' + currentSets.map(s => {
    const id = s._id || s.id;
    const isActive = s.active !== false;
    return `<div class="set-item ${isActive ? '' : 'inactive'}" id="set-item-${id}">
      <div class="set-item-info">
        <h3>${esc(s.manualName || s.name || '無題')} ${isActive ? '' : '<span style="font-size:0.75rem;color:#dc2626;">（停止中）</span>'}</h3>
        <p>${(s.questions||[]).length}問 ／ 作成: ${formatDate(s.createdAt)}</p>
      </div>
      <div class="set-item-actions">
        <button class="btn ${isActive ? 'btn-warning' : 'btn-success'}" onclick="toggleActive('${id}', ${isActive})">${isActive ? '⛔ 停止' : '✅ 公開'}</button>
        <button class="btn btn-secondary" onclick="openEditModal('${id}')">✏️ 編集</button>
        <button class="btn btn-danger" onclick="openDeleteModal('${id}', '${esc(s.manualName||s.name||'')}')}">🗑 削除</button>
      </div>
    </div>`;
  }).join('') + '</div>';
}

async function toggleActive(id, currentActive) {
  try {
    const r = await fetch('/api/sets/' + id + '/active', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', Authorization: authHeader },
      body: JSON.stringify({ active: !currentActive }),
    });
    if (!r.ok) throw new Error();
    await loadSets();
  } catch {
    alert('更新に失敗しました');
  }
}

// ========== Edit Modal ==========
function openEditModal(id) {
  const set = currentSets.find(s => (s._id||s.id) === id);
  if (!set) return;
  editingSetId = id;
  document.getElementById('edit-name').value = set.manualName || set.name || '';
  const container = document.getElementById('edit-questions');
  container.innerHTML = '';
  (set.questions || []).forEach((q, i) => appendQuestionEditor(container, q, i));
  document.getElementById('edit-modal').classList.remove('hidden');
}

function closeEditModal() {
  document.getElementById('edit-modal').classList.add('hidden');
  editingSetId = null;
}

function addQuestionToEdit() {
  const container = document.getElementById('edit-questions');
  const idx = container.children.length;
  appendQuestionEditor(container, { type: 'truefalse', question: '', options: [], answer: 'true', explanation: '' }, idx);
}

async function saveEdit() {
  const name = document.getElementById('edit-name').value.trim();
  if (!name) { alert('マニュアル名を入力してください'); return; }
  const questions = collectEditQuestions('edit-questions');
  try {
    const r = await fetch('/api/sets/' + editingSetId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: authHeader },
      body: JSON.stringify({ manualName: name, questions })
    });
    if (!r.ok) throw new Error();
    closeEditModal();
    loadSets();
  } catch {
    alert('保存に失敗しました');
  }
}

// ========== Delete Modal ==========
function openDeleteModal(id, name) {
  deletingSetId = id;
  document.getElementById('delete-set-name').textContent = name;
  document.getElementById('delete-modal').classList.remove('hidden');
}
function closeDeleteModal() {
  document.getElementById('delete-modal').classList.add('hidden');
  deletingSetId = null;
}
async function confirmDelete() {
  try {
    const r = await fetch('/api/sets/' + deletingSetId, { method: 'DELETE', headers: { Authorization: authHeader } });
    if (!r.ok) throw new Error();
    closeDeleteModal();
    loadSets();
  } catch { alert('削除に失敗しました'); }
}

// ========== Generate Tab ==========
async function generateQuestions() {
  const text = document.getElementById('manual-text').value.trim();
  const name = document.getElementById('manual-name').value.trim();
  const count = parseInt(document.getElementById('q-count').value);
  if (!text) { showGenerateStatus('error', 'マニュアルテキストを入力してください'); return; }
  if (!name) { showGenerateStatus('error', 'マニュアル名を入力してください'); return; }
  document.getElementById('generated-questions-wrap').style.display = 'none';
  showGenerateStatus('loading', '');
  try {
    const r = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: authHeader },
      body: JSON.stringify({ manualText: text, count })
    });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || 'エラー'); }
    const data = await r.json();
    generatedQuestions = data.questions || data;
    showGenerateStatus('', '');
    renderGeneratedQuestions();
  } catch(e) {
    showGenerateStatus('error', 'AI生成に失敗しました: ' + e.message);
  }
}

function showGenerateStatus(type, msg) {
  const el = document.getElementById('generate-status');
  if (type === 'loading') {
    el.innerHTML = '<div class="card spinner-wrap"><div class="spinner"></div> AIが問題を生成しています…しばらくお待ちください</div>';
  } else if (type === 'error') {
    el.innerHTML = `<div class="alert alert-error">${esc(msg)}</div>`;
  } else {
    el.innerHTML = '';
  }
}

function renderGeneratedQuestions() {
  const wrap = document.getElementById('generated-questions-wrap');
  const container = document.getElementById('generated-questions');
  container.innerHTML = '';
  generatedQuestions.forEach((q, i) => appendQuestionEditor(container, q, i, true));
  wrap.style.display = 'block';
}

async function saveGeneratedSet() {
  const name = document.getElementById('manual-name').value.trim();
  if (!name) { alert('マニュアル名を入力してください'); return; }
  const questions = collectEditQuestions('generated-questions');
  try {
    const r = await fetch('/api/sets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: authHeader },
      body: JSON.stringify({ manualName: name, questions })
    });
    if (!r.ok) throw new Error();
    document.getElementById('generate-status').innerHTML = '<div class="alert alert-success">✅ クイズセットを保存しました！</div>';
    document.getElementById('generated-questions-wrap').style.display = 'none';
    document.getElementById('manual-text').value = '';
    document.getElementById('manual-name').value = '';
    generatedQuestions = [];
  } catch { alert('保存に失敗しました'); }
}

// ========== Question Editor ==========
function appendQuestionEditor(container, q, idx) {
  const div = document.createElement('div');
  div.className = 'question-editor';
  div.dataset.idx = idx;
  div.innerHTML = buildQuestionEditorHTML(q, idx);
  container.appendChild(div);
  div.querySelector('.q-question-input').value = q.question || '';
  div.querySelector('.q-explanation-input').value = q.explanation || '';
  updateTypeFields(div, q);
  div.querySelector('.q-type-select').addEventListener('change', function() {
    const defaultQ = { type: this.value, question: div.querySelector('.q-question-input').value, options: [], answer: this.value === 'truefalse' ? 'true' : '', explanation: div.querySelector('.q-explanation-input').value };
    updateTypeFields(div, defaultQ);
  });
}

function buildQuestionEditorHTML(q, idx) {
  return `
    <div class="q-header">
      <span class="q-num">問 ${idx + 1}</span>
      <button class="btn btn-danger" style="padding:4px 10px;font-size:0.78rem;" onclick="this.closest('.question-editor').remove();reindexEditors(this.closest('.question-editor').parentElement)">削除</button>
    </div>
    <div class="q-fields">
      <div>
        <label>問題タイプ</label>
        <select class="q-type-select">
          <option value="truefalse" ${q.type==='truefalse'?'selected':''}>○×（正誤）</option>
          <option value="choice" ${q.type==='choice'?'selected':''}>選択肢（ABCD）</option>
          <option value="fill" ${q.type==='fill'?'selected':''}>穴埋め</option>
          <option value="sort" ${q.type==='sort'?'selected':''}>並び替え</option>
        </select>
      </div>
      <div>
        <label>問題文</label>
        <textarea class="q-question-input" rows="2"></textarea>
      </div>
      <div class="q-type-fields"></div>
      <div>
        <label>解説</label>
        <input type="text" class="q-explanation-input">
      </div>
    </div>
  `;
}

function updateTypeFields(editorDiv, q) {
  const type = q.type;
  const container = editorDiv.querySelector('.q-type-fields');
  if (type === 'truefalse') {
    container.innerHTML = `
      <label>正解</label>
      <select class="q-answer-select">
        <option value="true" ${q.answer==='true'||q.answer===true?'selected':''}>○（正しい）</option>
        <option value="false" ${q.answer==='false'||q.answer===false?'selected':''}>×（誤り）</option>
      </select>`;
  } else if (type === 'choice') {
    const opts = q.options && q.options.length ? q.options : ['', '', '', ''];
    const letters = ['A','B','C','D','E'];
    const ansIdx = opts.indexOf(q.answer);
    const rname = 'ans_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    container.innerHTML = `
      <label>選択肢と正解</label>
      <div class="options-list">
        ${opts.map((o, i) => `
          <div class="option-row">
            <span style="font-weight:700;min-width:20px;">${letters[i]}</span>
            <input type="text" class="q-option" data-idx="${i}" value="${esc(o)}">
            <label style="display:flex;align-items:center;gap:4px;font-size:0.8rem;white-space:nowrap;">
              <input type="radio" name="${rname}" class="q-answer-radio" value="${i}" ${ansIdx===i?'checked':''}> 正解
            </label>
          </div>`).join('')}
      </div>
      <button class="btn btn-secondary add-option-btn" onclick="addChoiceOption(this)">＋ 選択肢を追加</button>`;
  } else if (type === 'fill') {
    const ans = Array.isArray(q.answer) ? q.answer : (q.answer ? [q.answer] : ['']);
    container.innerHTML = `
      <label>正解（___の順番で）</label>
      <div class="options-list q-fill-answers">
        ${ans.map((a, i) => `
          <div class="option-row">
            <span style="font-weight:700;min-width:20px;">${i+1}</span>
            <input type="text" class="q-fill-answer" value="${esc(a)}">
            <button class="btn btn-danger" style="padding:4px 8px;font-size:0.75rem;" onclick="this.closest('.option-row').remove()">✕</button>
          </div>`).join('')}
      </div>
      <button class="btn btn-secondary add-option-btn" onclick="addFillAnswer(this)">＋ 答えを追加</button>`;
  } else if (type === 'sort') {
    const opts = q.options && q.options.length ? q.options : ['', '', ''];
    container.innerHTML = `
      <label>正しい順番（上から順番通りに入力 ※スタッフ画面ではシャッフルされます）</label>
      <div class="options-list q-sort-list">
        ${opts.map((o, i) => `
          <div class="option-row">
            <span style="font-weight:700;min-width:20px;">${i+1}</span>
            <input type="text" class="q-sort-item" value="${esc(o)}">
            <button class="btn btn-danger" style="padding:4px 8px;font-size:0.75rem;" onclick="this.closest('.option-row').remove()">✕</button>
          </div>`).join('')}
      </div>
      <button class="btn btn-secondary add-option-btn" onclick="addSortItem(this)">＋ 項目を追加</button>`;
  }
}

function addChoiceOption(btn) {
  const list = btn.previousElementSibling;
  const rows = list.querySelectorAll('.option-row');
  const letters = ['A','B','C','D','E','F'];
  const i = rows.length;
  if (i >= letters.length) return;
  const rname = list.querySelector('.q-answer-radio') ? list.querySelector('.q-answer-radio').name : 'ans_' + Date.now();
  const row = document.createElement('div');
  row.className = 'option-row';
  row.innerHTML = `<span style="font-weight:700;min-width:20px;">${letters[i]}</span><input type="text" class="q-option" data-idx="${i}"><label style="display:flex;align-items:center;gap:4px;font-size:0.8rem;white-space:nowrap;"><input type="radio" name="${rname}" class="q-answer-radio" value="${i}"> 正解</label>`;
  list.appendChild(row);
}

function addFillAnswer(btn) {
  const list = btn.previousElementSibling;
  const i = list.children.length;
  const row = document.createElement('div');
  row.className = 'option-row';
  row.innerHTML = `<span style="font-weight:700;min-width:20px;">${i+1}</span><input type="text" class="q-fill-answer"><button class="btn btn-danger" style="padding:4px 8px;font-size:0.75rem;" onclick="this.closest('.option-row').remove()">✕</button>`;
  list.appendChild(row);
}

function addSortItem(btn) {
  const list = btn.previousElementSibling;
  const i = list.children.length;
  const row = document.createElement('div');
  row.className = 'option-row';
  row.innerHTML = `<span style="font-weight:700;min-width:20px;">${i+1}</span><input type="text" class="q-sort-item"><button class="btn btn-danger" style="padding:4px 8px;font-size:0.75rem;" onclick="this.closest('.option-row').remove()">✕</button>`;
  list.appendChild(row);
}

function reindexEditors(container) {
  if (!container) return;
  container.querySelectorAll('.question-editor').forEach((div, i) => {
    const num = div.querySelector('.q-num');
    if (num) num.textContent = '問 ' + (i + 1);
    div.dataset.idx = i;
  });
}

function collectEditQuestions(containerId) {
  const container = document.getElementById(containerId);
  const questions = [];
  container.querySelectorAll('.question-editor').forEach(div => {
    const type = div.querySelector('.q-type-select').value;
    const question = div.querySelector('.q-question-input').value.trim();
    const explanation = div.querySelector('.q-explanation-input').value.trim();
    let options = [], answer;
    if (type === 'truefalse') {
      answer = div.querySelector('.q-answer-select').value;
      options = [];
    } else if (type === 'choice') {
      options = Array.from(div.querySelectorAll('.q-option')).map(i => i.value.trim());
      const checked = div.querySelector('.q-answer-radio:checked');
      const checkedIdx = checked ? parseInt(checked.value, 10) : 0;
      answer = options[checkedIdx] || options[0] || '';
    } else if (type === 'fill') {
      answer = Array.from(div.querySelectorAll('.q-fill-answer')).map(i => i.value.trim());
      options = [];
    } else if (type === 'sort') {
      options = Array.from(div.querySelectorAll('.q-sort-item')).map(i => i.value.trim());
      answer = [...options];
    }
    questions.push({ type, question, options, answer, explanation });
  });
  return questions;
}

// ========== Submissions Tab ==========
async function loadSubmissions() {
  const el = document.getElementById('submissions-list');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div> 読み込み中…</div>';
  try {
    const r = await fetch('/api/submissions', { headers: { Authorization: authHeader } });
    if (!r.ok) throw new Error();
    const subs = await r.json();
    if (!subs.length) {
      el.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>まだ回答記録がありません</p></div>';
      return;
    }
    el.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>日時</th><th>スタッフ名</th><th>マニュアル名</th><th>スコア</th><th>回答詳細</th></tr></thead>
      <tbody>${subs.map((s, idx) => {
        const total = s.total || 0;
        const score = s.score || 0;
        const pct = total ? Math.round(score / total * 100) : 0;
        const badgeClass = pct >= 80 ? 'badge-green' : pct >= 60 ? 'badge-yellow' : 'badge-red';
        return `<tr>
          <td style="white-space:nowrap;">${formatDate(s.submittedAt||s.createdAt)}</td>
          <td>${esc(s.staffName||'不明')}</td>
          <td>${esc(s.manualName||'不明')}</td>
          <td><span class="badge ${badgeClass}">${score}/${total} (${pct}%)</span></td>
          <td>
            <button class="sub-detail-toggle" onclick="toggleSubDetail('sub-${idx}')">詳細 ▾</button>
            <div class="sub-detail-body" id="sub-${idx}">
              ${buildSubDetailHtml(s)}
            </div>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
  } catch {
    el.innerHTML = '<div class="alert alert-error">読み込みに失敗しました</div>';
  }
}

function toggleSubDetail(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

function buildSubDetailHtml(s) {
  if (!s.results || !s.results.length) return '<div style="color:#6b7280;font-size:0.8rem;padding:4px 0;">詳細なし</div>';
  return s.results.map((r, i) => {
    const icon = r.isCorrect ? '⭕' : '❌';
    const cls = r.isCorrect ? 'sub-detail-correct' : 'sub-detail-wrong';
    return `<div class="sub-detail-item ${cls}">
      ${icon} 問${i+1}: ${esc(r.question||'')}
      ${!r.isCorrect ? `<br><span style="color:#6b7280;">　あなた: ${formatAnsText(r.type, r.userAnswer)} ／ 正解: ${formatAnsText(r.type, r.correctAnswer)}</span>` : ''}
    </div>`;
  }).join('');
}

function formatAnsText(type, ans) {
  if (ans === null || ans === undefined) return '（未回答）';
  if (type === 'truefalse') return String(ans) === 'true' ? '○正しい' : '×誤り';
  if (type === 'sort') return Array.isArray(ans) ? ans.join('→') : String(ans);
  if (type === 'fill') return Array.isArray(ans) ? ans.join(' / ') : String(ans);
  return esc(String(ans));
}

// ========== Staff Tab ==========
async function loadStaffTab() {
  const el = document.getElementById('staff-list');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div> 読み込み中…</div>';
  try {
    const r = await fetch('/api/submissions', { headers: { Authorization: authHeader } });
    if (!r.ok) throw new Error();
    const subs = await r.json();
    if (!subs.length) {
      el.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>まだ回答記録がありません</p></div>';
      return;
    }
    // Group by staffName
    const groups = {};
    subs.forEach(s => {
      const name = s.staffName || '不明';
      if (!groups[name]) groups[name] = [];
      groups[name].push(s);
    });
    const sorted = Object.entries(groups).sort((a, b) => a[0].localeCompare(b[0], 'ja'));
    el.innerHTML = sorted.map(([name, records]) => {
      const totalSessions = records.length;
      const avgPct = Math.round(records.reduce((acc, s) => acc + (s.total ? s.score / s.total * 100 : 0), 0) / totalSessions);
      const safeName = name.replace(/'/g, "\\'");
      return `<div class="staff-group">
        <div class="staff-group-header" onclick="toggleStaffGroup('sg-${encodeURIComponent(name)}')">
          <div>
            <div class="staff-name-label">👤 ${esc(name)}</div>
            <div class="staff-stats">${totalSessions}回受験 ／ 平均スコア ${avgPct}%</div>
          </div>
          <span class="staff-toggle-icon">▾</span>
        </div>
        <div class="staff-history" id="sg-${encodeURIComponent(name)}">
          ${records.map((s, si) => {
            const total = s.total || 0;
            const score = s.score || 0;
            const pct = total ? Math.round(score / total * 100) : 0;
            const badgeClass = pct >= 80 ? 'badge-green' : pct >= 60 ? 'badge-yellow' : 'badge-red';
            const detailId = 'sh-' + encodeURIComponent(name) + '-' + si;
            return `<div class="staff-history-item">
              <div class="h-meta">${formatDate(s.submittedAt||s.createdAt)} ／ ${esc(s.manualName||'不明')}</div>
              <div class="h-score">
                <span class="badge ${badgeClass}">${score}/${total} (${pct}%)</span>
                <button class="sub-detail-toggle" style="margin-left:8px;" onclick="toggleStaffDetail('${detailId}')">詳細 ▾</button>
              </div>
              <div class="h-details" id="${detailId}">
                ${(s.results||[]).map((r, ri) => {
                  const icon = r.isCorrect ? '⭕' : '❌';
                  const cls = r.isCorrect ? 'sub-detail-correct' : 'sub-detail-wrong';
                  return `<div class="h-q-item ${cls}">
                    ${icon} 問${ri+1}: ${esc(r.question||'')}
                    ${!r.isCorrect ? `<br><span style="color:#6b7280;">　あなた: ${formatAnsText(r.type, r.userAnswer)} ／ 正解: ${formatAnsText(r.type, r.correctAnswer)}</span>` : ''}
                  </div>`;
                }).join('')}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('');
  } catch {
    el.innerHTML = '<div class="alert alert-error">読み込みに失敗しました</div>';
  }
}

function toggleStaffGroup(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

function toggleStaffDetail(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

// ========== Manual Integration ==========
let manualList = [];

async function loadManualList() {
  const btn = document.getElementById('manual-load-btn');
  const status = document.getElementById('manual-load-status');
  const sel = document.getElementById('manual-select');
  btn.disabled = true;
  status.textContent = '読み込み中…';
  try {
    const r = await fetch('/api/manual-list', { headers: { Authorization: authHeader } });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || 'エラー'); }
    manualList = await r.json();
    sel.innerHTML = '<option value="">— マニュアルを選択してください —</option>';
    let lastMain = null;
    let lastSub = null;
    let group = null;
    manualList.forEach(m => {
      const mainCat = m.main_category || 'カテゴリなし';
      const subCat = (m.sub_category && m.sub_category !== m.main_category) ? m.sub_category : null;
      if (mainCat !== lastMain) {
        if (group) sel.appendChild(group);
        group = document.createElement('optgroup');
        group.label = '━━ ' + mainCat + ' ━━';
        lastMain = mainCat;
        lastSub = null;
      }
      if (subCat && subCat !== lastSub) {
        const sep = document.createElement('option');
        sep.disabled = true;
        sep.textContent = '  ▸ ' + subCat;
        sep.style.color = '#6b7280';
        group.appendChild(sep);
        lastSub = subCat;
      }
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = (subCat ? '　　' : '　') + m.title;
      opt.dataset.type = m.type;
      group.appendChild(opt);
    });
    if (group) sel.appendChild(group);
    status.textContent = `${manualList.length}件のマニュアルを読み込みました`;
  } catch (e) {
    status.style.color = '#dc2626';
    status.textContent = '読み込み失敗: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

async function onManualSelect() {
  const sel = document.getElementById('manual-select');
  const id = sel.value;
  if (!id) return;
  const manual = manualList.find(m => String(m.id) === String(id));
  if (!manual) return;
  const status = document.getElementById('manual-load-status');
  status.style.color = '#4f46e5';
  status.textContent = `「${manual.title}」のテキストを取得中…`;
  try {
    const r = await fetch('/api/manual-text/' + id, { headers: { Authorization: authHeader } });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || 'エラー'); }
    const data = await r.json();
    document.getElementById('manual-name').value = data.title || manual.title;
    document.getElementById('manual-text').value = data.text || '';
    status.style.color = '#16a34a';
    status.textContent = `✅ 「${data.title}」を読み込みました`;
  } catch (e) {
    status.style.color = '#dc2626';
    status.textContent = 'テキスト取得失敗: ' + e.message;
  }
}

// ========== Utils ==========
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatDate(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt)) return '—';
  return dt.toLocaleDateString('ja-JP') + ' ' + dt.toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit'});
}

document.getElementById('edit-modal').addEventListener('click', function(e) { if (e.target === this) closeEditModal(); });
document.getElementById('delete-modal').addEventListener('click', function(e) { if (e.target === this) closeDeleteModal(); });
