services:
  - type: web
    name: works-app
    runtime: node
    rootDir: works-app
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: works-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: VAPID_PUBLIC_KEY
        value: BDeuGR14ThpnFywEC5JbEsUnf-sl48IlF9lp6AYgr4Z5dF6yOOP4ixL61lSdxxJKbeSTIBPAGIn5Al5XGDb_YVU
      - key: VAPID_PRIVATE_KEY
        value: HhenR1vR8yxrAUfiLfPpNQ4eDii-vuIGoEvvXxLeMHk

databases:
  - name: works-db
    databaseName: works
    plan: free
